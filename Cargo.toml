[workspace]
resolver = "2"
members = [
    "crates/arbos-core",
    "crates/arbos-relay",
    "crates/arbos-agentd",
    "crates/arbosctl",
    "crates/arbos-local",
    "crates/arbos-mac",
    "crates/arbos-update",
]

[workspace.package]
version = "0.6.32"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
arbos-core = { path = "crates/arbos-core" }
arbos-update = { path = "crates/arbos-update" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
loro = "1.16"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
jsonschema = { version = "0.26", default-features = false }
base64 = "0.22"
regex-lite = "0.1"
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process", "user"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
roxmltree = "0.20"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

# GPUI is unusably slow unoptimised; optimise dependencies only.
[profile.dev.package."*"]
opt-level = 2
