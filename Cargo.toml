[workspace]
resolver = "2"
members = [
    "crates/arbos-core",
    # App-only sans-IO room session. Only arbos-mac and arbos-ffi may depend on
    # it. arbos-relay, arbos-agentd, arbosctl, and arbos-local must not.
    "crates/arbos-client",
    # Shared Matrix client (D88 C1): servers and channels for the device apps. Like
    # arbos-client, only arbos-mac and arbos-ffi may depend on it.
    "crates/arbos-matrix",
    # UniFFI / Swift bindings over arbos-client + core. The only crate that
    # names Swift or uniffi.
    "crates/arbos-ffi",
    "crates/arbos-relay",
    "crates/arbos-agentd",
    "crates/arbosctl",
    # Outside agents (#2143): ACP agent ⇄ relay bridge. Depends on nothing in the workspace.
    "crates/arbos-acp",
    # Outside agents (#2190): the sidecar on the agent's own machine. Depends on nothing in the workspace.
    "crates/arbos-sidecar",
    "crates/arbos-local",
    "crates/arbos-mac",
    "crates/arbos-update",
]

[workspace.package]
version = "0.6.355"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
arbos-core = { path = "crates/arbos-core" }
arbos-client = { path = "crates/arbos-client" }
arbos-matrix = { path = "crates/arbos-matrix" }
arbos-ffi = { path = "crates/arbos-ffi" }
arbos-update = { path = "crates/arbos-update" }
# Exact pin: arbos-core, the relay box and the Swift client (through ArbosFFI) must agree on the Loro encoding.
loro = "=1.16.2"
uniffi = "=0.32.2"

anyhow = "1"
thiserror = "2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin: arbos-core DTOs and scripts/gen-swift-types.sh (typeshare-cli) must agree.
typeshare = "=1.0.5"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# The device's IANA zone on user rows (`tz`), so the agent answers for the user's moment.
iana-time-zone = "0.1"
jsonschema = { version = "0.26", default-features = false }
base64 = "0.22"
regex-lite = "0.1"
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
roxmltree = "0.20"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbol names stay (debug info goes): a panic backtrace in panic.log and a crash report's
# frames then name the function instead of an offset (2026-10-26 Mac launch crashes).
strip = "debuginfo"

[profile.dev]
opt-level = 0

# GPUI is unusably slow unoptimised; optimise dependencies only.
[profile.dev.package."*"]
opt-level = 2
