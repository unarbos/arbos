# Alerts. All go to the one Alertmanager receiver. Summaries carry no box or user names (the alert
# channel is not the admin dashboard): they say what is wrong and which dashboard shows where.
groups:
  - name: arbos
    rules:
      - alert: RelayDown
        expr: probe_success{job="relay-health"} == 0
        for: 1m
        annotations:
          summary: The relay does not answer /healthz on the host.

      - alert: HealthProbeFailing
        expr: probe_success{job="public-https"} == 0
        for: 2m
        annotations:
          summary: "{{ $labels.instance }} fails from outside (DNS, Caddy, TLS or the service)."

      - alert: TLSExpirySoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 10m
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      - alert: ScrapeTargetDown
        # A target that has never answered (the relay before it serves /metrics) stays quiet.
        expr: up == 0 and on (job, instance) max_over_time(up[1d]) == 1
        for: 3m
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}."

      - alert: DiskFreeLow
        expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes < 0.15
        for: 5m
        annotations:
          summary: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free."

      - alert: DiskFullWithin24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}[6h], 24 * 3600) < 0
        for: 30m
        annotations:
          summary: "{{ $labels.mountpoint }} is on course to fill within 24 hours."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        annotations:
          summary: "The host has {{ $value | humanizePercentage }} memory available."

      - alert: BoxStartFailures
        expr: sum(increase(arbos_box_starts_total{result="error"}[10m])) > 0
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} box starts failed in the last 10 minutes."

      - alert: Waitlist
        expr: arbos_boxes_waitlisted > 0
        for: 5m
        annotations:
          summary: "{{ $value }} users are waiting for a box: the host is at its box limit."

      - alert: BoxOOMKilled
        # A killed box's container can be gone before its own counter is scraped twice, so the
        # host-wide kernel counter is the trigger; the Boxes dashboard shows which one.
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        annotations:
          summary: "The kernel OOM-killed {{ $value | printf \"%.0f\" }} processes in the last 10 minutes (Boxes dashboard → OOM kills)."

      - alert: RelayRestarted
        expr: >
          changes(container_start_time_seconds{id="/system.slice/arbos-relay.service"}[15m]) > 0
          or changes(process_start_time_seconds{job="relay"}[15m]) > 0
        annotations:
          summary: The relay restarted in the last 15 minutes.

      - alert: RelayMemoryHigh
        # The relay sat at ~22 GB on 2026-11-18. Tune this number as the real ceiling becomes known.
        expr: container_memory_rss{id="/system.slice/arbos-relay.service"} > 40 * 1024^3
        for: 10m
        annotations:
          summary: "Relay memory is {{ $value | humanize1024 }}B and past 40 GiB."
