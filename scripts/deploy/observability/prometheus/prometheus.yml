# Scrapes loopback only (host networking). Rules: rules.yml (alerts) and subnet-rules.yml (the
# label-free aggregates the Subnet view is built from).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - rules.yml
  - subnet-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: cadvisor
    scrape_interval: 30s # cAdvisor refreshes every 30 s (--housekeeping_interval)
    static_configs:
      - targets: ["127.0.0.1:9180"]
    metric_relabel_configs:
      # Keep Docker containers (they have a name), the root cgroup, and the service cgroups we chart.
      - source_labels: [name, id]
        separator: ;
        regex: .+;.*|;/|;/system\.slice/(arbos-[^/]+|caddy|docker|containerd|livekit)\.service
        action: keep

  # The relay's own metrics and the per-box agentd metrics it fans out (names: README "Metric
  # contract"). Both routes need the read-only metrics token. Until the relay serves them these two
  # targets are down; ScrapeTargetDown leaves them out until they have answered once.
  - job_name: relay
    authorization:
      credentials_file: /etc/secrets/relay-metrics-token
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["127.0.0.1:7700"]

  - job_name: boxes
    metrics_path: /box-metrics
    scrape_interval: 30s
    authorization:
      credentials_file: /etc/secrets/relay-metrics-token
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["127.0.0.1:7700"]

  # Is the relay answering, asked directly (no Caddy, no DNS, no TLS in the way).
  - job_name: relay-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://127.0.0.1:7700/healthz"]
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # What a user's device sees: DNS, Caddy, the certificate, then the relay / the site.
  - job_name: public-https
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://relay.arbos.life/healthz
          - https://arbos.life/
    relabel_configs: *probe
