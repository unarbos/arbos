[package]
name = "arbos-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Box entrypoint: doc host, pi main-agent driver, HarnessAdapter registry, project MCP, SQLite+FTS5 history and memory"

[dependencies]
arbos-core = { workspace = true, features = ["chart-png"] }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
rusqlite.workspace = true
loro.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
# Verifies the relay address pushed into this box; the box never holds the signing half.
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
async-trait.workspace = true
nix.workspace = true
regex-lite.workspace = true
rand.workspace = true
base64.workspace = true
ulid.workspace = true

# `tokio::time::pause`, for the send-order valve test: its wait is minutes long, so a test has to
# drive the clock rather than sit on it. A dev-dependency and not a feature on the line above,
# because resolver 2 keeps dev-only features out of the shipped binary, and tokio asks that
# `test-util` stay out of production builds. `arbos-sidecar` enables it the same way.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
