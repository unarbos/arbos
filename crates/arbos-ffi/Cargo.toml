[package]
name = "arbos-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "UniFFI bindings over arbos-client and arbos-core for the Swift client"

[lib]
crate-type = ["staticlib", "lib"]
name = "arbos_ffi"

[dependencies]
arbos-core.workspace = true
arbos-client.workspace = true
arbos-matrix.workspace = true
arbos-wallet.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only this crate may depend on uniffi (workspace pin =0.32.2). `tokio` runs the async Matrix
# calls (sliding sync, sends) on a runtime the bindings own.
uniffi = { workspace = true, features = ["tokio"] }
tokio.workspace = true
loro.workspace = true

[dev-dependencies]
serde_json.workspace = true
