[package]
name = "arbos-boxd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Root daemon on a compute host: runs each user's box as a self-managed OCI bundle under runsc, and sleeps, wakes and grows it"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac = "0.12"
hex.workspace = true
chrono.workspace = true
async-trait.workspace = true
nix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# TLS for a relay on another host. Both are what reqwest already builds; ring is its provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
