[package]
name = "arbos-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Arbos desktop client (GPUI)"
build = "build.rs"

[[bin]]
name = "arbos-mac"
path = "src/main.rs"

[dependencies]
# `chart-png`: Save PNG of a chart bubble renders through the core picture renderer (resvg,
# which gpui already builds).
arbos-core = { workspace = true, features = ["chart-png"] }
arbos-client.workspace = true
arbos-matrix.workspace = true
arbos-update.workspace = true
rusqlite.workspace = true

anyhow.workspace = true
futures.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# Two TLS-using crates pull rustls with different crypto backends (ring and
# aws-lc-rs), so rustls cannot pick a process default by itself; main installs
# ring before any wss:// / HTTPS connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest.workspace = true
ulid.workspace = true
base64.workspace = true
sha2.workspace = true
chrono.workspace = true
log = "0.4"
# Sign in with GitHub: the NSView behind the GPUI window anchors the system sheet.
raw-window-handle = "0.6"

gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }

unicode-segmentation = "1"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico", "gif", "webp"] }
env_logger = "0.11"

# Calls v1: LiveKit (user↔user voice/video); prebuilt libwebrtc is fetched by webrtc-sys at build time.
livekit = { version = "0.9", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }

# Voice (F11): capture, playback, WAV in memory.
cpal = "0.15"
# D79 initials avatars: the notification PNG draws its letters through the system sans-serif.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "symphonia-wav", "symphonia-isomp4", "symphonia-aac"] }
hound = "3.5"
velato = { version = "0.12", default-features = false }
kurbo = "0.13"

# Sign in with GitHub (ASWebAuthenticationSession), notifications
# (UNUserNotificationCenter) and the Dock badge through objc2 (macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
# Feedback screenshots: CGWindowListCreateImage of our own window (no Screen Recording permission
# needed for the app's own windows, unlike the `screencapture` CLI).
core-graphics = "0.24"
foreign-types = "0.5"
# Calls v1 camera capture: AVFoundation through nokhwa.
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSError", "NSObject", "NSGeometry", "NSBundle", "NSArray", "NSSet", "NSEnumerator", "NSData"] }
# NSVisualEffectView / NSAppearance / NSGraphics: the Glass surface's window material
# (`ui::vibrancy`, [feedback mac-glass-contrast-2026-10-26]). NSPasteboard / NSPasteboardItem /
# NSImage: Copy of a picture message writes every type of one item itself (`pasteboard`,
# [feedback copy-image-messages-mac-2026-10-27]). NSImage / NSImageSymbolConfiguration /
# NSBitmapImageRep / NSGraphicsContext / NSColor / NSFontDescriptor: SF Symbols rasterised for the menus
# (`ui::sf_symbols`, [feedback menu-sf-symbols-2026-10-27]).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSDockTile", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSVisualEffectView", "NSAppearance", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSColor", "NSFontDescriptor", "objc2-core-foundation", "block2", "objc2-uniform-type-identifiers"] }
# Avatar picker: NSOpenPanel limited to image UTTypes (PNG, JPEG, HEIC, GIF, WebP).
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationAttachment", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationAction", "UNNotificationCategory", "UNNotificationSettings"] }
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASWebAuthenticationSession", "ASFoundation"] }

[dev-dependencies]
# `#[gpui::test]` for the composer: a headless app, keystrokes into a real window, no display needed.
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["test-support"] }
