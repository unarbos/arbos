[package]
name = "arbos-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The Arbos sidecar: one small program on an outside agent's machine that holds the relay connection, mirrors its chats to files, nudges the agent when it is needed, and serves a local MCP server + CLI"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
nix.workspace = true
hmac = "0.12"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
