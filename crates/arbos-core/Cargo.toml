[package]
name = "arbos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Shared Arbos types: ids, wire frames, Loro chat-doc schema, route schema, pi RPC codec"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
typeshare.workspace = true
bytes.workspace = true
loro.workspace = true
ulid.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
chrono.workspace = true
iana-time-zone.workspace = true
regex-lite.workspace = true
# The shared search matcher folds diacritics (NFD, combining marks dropped).
unicode-normalization = "0.1"
syntect.workspace = true
# PNG fallback for chart bubbles (agentd only; the apps draw charts natively).
resvg = { version = "0.46", default-features = false, features = ["text"], optional = true }

[features]
chart-png = ["dep:resvg"]
