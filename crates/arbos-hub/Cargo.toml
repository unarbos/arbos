[package]
name = "arbos-hub"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Arbos hub: kernels and workers register outbound; clients attach, spawn, and message by machine name"

[[bin]]
name = "arbos-hub"
path = "src/main.rs"

[dependencies]
arbos-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
# Server side only; TLS ends at the tunnel (cloudflared, Caddy) in front.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# APNs: HTTP/2 to api.push.apple.com with an ES256 JWT (`[push]` in the config).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
