[package]
name = "arbos-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Arbos kernel: serve, tgrep, schedule, attach"

[[bin]]
name = "arbos-kernel"
path = "src/main.rs"

[dependencies]
arbos-core.workspace = true
arbos-engine.workspace = true
anyhow.workspace = true
base64 = "0.22"
portable-pty = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tgrep-core = { path = "../../vendor/tgrep/tgrep-core" }
regex = "1"
glob = "0.3"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
# Chrome DevTools Protocol for the browser tool: plain ws:// to a local
# headless Chrome, so no TLS feature is needed.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
