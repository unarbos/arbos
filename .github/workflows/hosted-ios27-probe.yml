# Throwaway probe (not for merging): can macos-15 run the gate's UI tests on an iOS 27.0 simulator
# runtime downloaded inside the job, with the gate's Xcode 26.3? (Run 41186520451 has the image
# survey and main's gate on xcode-27.)
name: hosted iOS 27 probe
on:
  push:
    branches: ["cursor/hosted-ios27-probe-ac8d"]
permissions:
  contents: read
jobs:
  macos15-ios27:
    name: macos-15, Xcode 26.3, downloaded iOS 27.0, ChatSearch cases
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26.3 and the iOS 27.0 runtime
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          start=$(date +%s)
          if ! xcodebuild -downloadPlatform iOS -buildVersion 27.0 2>&1 | grep -vE 'Downloading iOS|Hash =|asset' | tail -5; then
            echo "Xcode 26.3 cannot fetch it; fetching through the image's default Xcode 16.4"
            sudo xcode-select -s /Applications/Xcode_16.4.app
            xcodebuild -downloadPlatform iOS -buildVersion 27.0 2>&1 | grep -vE 'Downloading iOS|Hash =|asset' | tail -5
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          echo "runtime in place after $(( $(date +%s) - start )) s"
          xcrun simctl list runtimes | grep iOS
          udid=$(xcrun simctl create "iPhone 17 iOS27" "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "UDID=$udid" >> "$GITHUB_ENV"
          echo "created $udid"
      - name: Rust toolchain
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build ArbosFFI xcframework
        run: ./scripts/build-xcframework.sh
      - name: Destinations Xcode 26.3 offers
        working-directory: apps/ios/Arbos
        run: xcodebuild -showdestinations -project Arbos.xcodeproj -scheme Arbos 2>&1 | grep -E "iPhone 17|Ineligible|error" | head -20 || true
      - name: ChatSearch cases on iOS 27.0
        working-directory: apps/ios/Arbos
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild test -project Arbos.xcodeproj -scheme Arbos -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath build/spm -collect-test-diagnostics never \
            -resultBundlePath build/ios27-chatsearch.xcresult \
            -only-testing:ArbosUITests/ChatSearchCloseUITests CODE_SIGNING_ALLOWED=NO > build/xcodebuild-test.log 2>&1
          rc=$?
          grep -E "[Tt]est [Cc]ase .*(passed|failed)|error|Executed|\*\* (TEST|BUILD)" build/xcodebuild-test.log | cut -c1-300 | tail -60
          echo "xcodebuild exit=$rc"
          exit "$rc"
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos15-ios27-chatsearch-${{ github.sha }}
          path: |
            apps/ios/Arbos/build/xcodebuild-*.log
            apps/ios/Arbos/build/ios27-chatsearch.xcresult
          if-no-files-found: ignore
          retention-days: 14
