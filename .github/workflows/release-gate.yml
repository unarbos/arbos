name: Release gate

# One fix per release. A pull request that publishes something waits while main still owes that
# same artifact, so release.yml never folds two fixes into one build.
#
# The decision is scripts/release/release-gate.py; read its header for what the two sides mean and
# why they are not symmetric. In short: the Mac side asks the repository's own predicates
# (scripts/release/mac-change.sh over scripts/release/mac-paths.sh), the phone side reads the
# literal path filter out of .github/workflows/ios.yml, and both are read at runtime so the
# verdict cannot drift away from what actually publishes.
#
# ── this is a required check ────────────────────────────────────────────────────────────────────
# main has no branch protection and no ruleset, so GitHub requires nothing. scripts/merge/checks.sh
# is the repository's required-check policy, and this workflow is named in its GATES list: a merge
# through the merge kit is refused while this run is red, absent or still going. The honest limit
# is that an unprotected main still permits a direct push, which no check can see. This binds
# every merge, not every possible write.
#
# ── CONSTRAINT: no job here may succeed without deciding ────────────────────────────────────────
# checks.sh reads this workflow's RUN conclusion, and GitHub concludes a run `success` when every
# job is success-or-skipped. So a job that can be skipped, or that passes without reaching a
# verdict, turns this gate quietly permissive without a line of checks.sh changing. Both jobs here
# are unconditional, and the gate job's one decisive step has no `if:` — a base branch that
# publishes nothing is handled inside the step, which still runs and still says so. Keep it that
# way, and do not add `continue-on-error` to anything in this file.
#
# ── the trigger list, and why it is not a second copy of the predicates ─────────────────────────
# GitHub needs a static `paths:` list to start a run at all, and a path the predicates watch that
# this list misses is a pull request the gate never sees. So the list is a superset of both
# predicates, and release-gate.py checks that on every run against mac-paths.sh and ios.yml as
# they stand in the tree — a gap fails the gate instead of passing quietly. The list also names
# ios.yml, mac-paths.sh and this file, so any pull request that moves either predicate runs this
# check and cannot widen one without widening the other.
#
# ── what this must never touch ──────────────────────────────────────────────────────────────────
# .github/workflows/ios.yml is inside its own trigger paths, so editing it cuts a TestFlight build.
# Nothing the gate is made of is on either path set — not this file, not scripts/release/*.py,
# not scripts/release/*.sh — so changing the gate never publishes anything. Keep it that way.
#
# Linux only. The hosted macos-15 pool is the critical path for a real release and a gate there
# can wait an hour and a half; this one must never be in that queue.

on:
  pull_request:
    paths:
      # Everything the Mac app is built from (scripts/release/mac-paths.sh).
      - "crates/arbos-mac/**"
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-matrix/**"
      - "crates/arbos-update/**"
      - "scripts/bundle-mac.sh"
      - "site/assets/logo/**"
      # Everything ios.yml uploads a TestFlight build for, that the Mac list does not already have.
      - "apps/ios/**"
      - "crates/arbos-ffi/**"
      - "packages/ArbosFFI/**"
      - "scripts/build-xcframework.sh"
      - "assets/avatars/trees/manifest.json"
      - "assets/avatars/trees/lottie/**"
      - "assets/avatars/leaves/**"
      - "rust-toolchain.toml"
      # On both lists.
      - "Cargo.toml"
      - "Cargo.lock"
      # The three files that define all of the above. A pull request that moves a predicate runs
      # this gate, so the coverage check above sees it.
      - ".github/workflows/ios.yml"
      - ".github/workflows/release-gate.yml"
      - "scripts/release/mac-paths.sh"
  workflow_dispatch:

permissions:
  contents: read
  # The phone side asks which ios.yml run on main last uploaded a build.
  actions: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The head commit itself, not the merge commit: the gate judges what this pull request
          # changes, and every history it walks is main's own. fetch-depth 0 brings the tags, which
          # are how a Mac release is known to have happened.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # The phone side reads ios.yml's path filter with a real YAML parser rather than a
      # hand-rolled one, so a filter this gate cannot parse is loud instead of silently empty.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet 'pyyaml==6.0.2'
      - name: Does merging this collapse two fixes into one release?
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          # Only main publishes: release.yml tags from it, and ios.yml uploads to TestFlight only
          # for a push to it. A pull request into any other branch has no release to wait for.
          # This is a step, not an `if:`, so the job never concludes without having said something.
          if [[ "$BASE_REF" != main ]]; then
            echo "Base branch is '$BASE_REF', not main: merging it publishes nothing." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The merge base, not main's head: a two-dot diff against the head would count whatever
          # main changed since this branch forked as part of the pull request.
          base="$(git merge-base origin/main "$HEAD_SHA")"
          # Exit 1 is a refusal, exit 2 is the gate failing to decide. Both fail the job: a check
          # that cannot tell must never read as a pass. Its output says which of the two it is.
          # TEMPORARY, REVERTED IN THE NEXT COMMIT. Crafted release-path-while-unreleased case,
          # so that this gate's refusal is observed as a real failing conclusion on a real run
          # rather than only inside the self-test. main is pinned to 83c2b5ebf with v0.6.379 as
          # the last stable release, which leaves #2645's Mac fix unreleased on it, and the pull
          # request under judgement is that same Mac fix.
          echo "proof run: judging a crafted dirty main, not this pull request ($base..$HEAD_SHA)"
          python3 scripts/release/release-gate.py \
            --repo "$GITHUB_REPOSITORY" --main 83c2b5ebf \
            --mac-released-sha 2402ff996 --ios-released-sha 83c2b5ebf \
            --pr-base 49608e2e8 --pr-head 83c2b5ebf

  self-test:
    # A gate nobody has watched refuse is not a tested guard. These cases replay states main has
    # really been in and assert that the gate blocks on the ones it must, for the right artifact.
    # They are offline and pinned to permanent commits, so they do not change answer as main moves.
    name: Release gate refuses when it should
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet 'pyyaml==6.0.2'
      - run: scripts/release/release-gate-selftest.sh
