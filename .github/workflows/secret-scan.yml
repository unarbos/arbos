name: Secret scan

# The repository is public: anything that lands here is world-readable for good, and history is
# never rewritten, so the only remedy for a committed credential is rotating it. This check reads
# the tree a push or a pull request brings, before it becomes history.
#
# History itself was scanned once (6,374 commits, every ref) and holds no live credential; it
# cannot change afterwards, so this scans the working tree (`--no-git`) rather than re-walking it
# on every run.
#
# Deliberately its own workflow, not a step inside CI. The three consumers of our check results
# read runs by workflow name or file — the feedback poller (`"CI"` / `"iOS"` / `"Release"`),
# scripts/release/auto-stable.sh and scripts/deploy/arbos-deploy-worker (both
# `actions/workflows/ci.yml/runs`) — so a run named `Secret scan` is invisible to all three and
# cannot gate a ship, a release or a relay deploy. It is a signal for people.
#
# `--redact` is not optional: this log is public.

on:
  push:
    branches: [main, arbos-v2, "cursor/**", "gate/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: gitleaks (working tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan
        run: |
          set -euo pipefail
          # --redact: a finding's value must never reach this log, which anyone can read.
          if /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml \
               --redact --no-banner --report-format json --report-path /tmp/gitleaks.json; then
            echo "No credential-shaped string in the tree." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Secret scan"
            echo
            echo "gitleaks flagged something. Values are redacted here and in the log on purpose."
            echo
            echo "| Rule | File | Line |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) |"' /tmp/gitleaks.json
            echo
            echo "A real credential is already public: rotate it. Rewriting history is not a remedy."
            echo "A fixture or a published constant: add a narrow regex to .gitleaks.toml saying which."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
