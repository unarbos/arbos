name: Swift core check

# Compiles arbos-ffi for this commit, then runs ArbosTests via fastlane (no
# signing, no TestFlight upload). Covers the shared client core surface the
# phone embeds as ArbosFFI.

on:
  push:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"

permissions:
  contents: read

# main COALESCES here, and that is a decision, not an oversight. Read this before porting #2735.
#
# The mechanism is the same one #2735 fixed in ci.yml. `cancel-in-progress` governs only a RUNNING
# run; a run still PENDING in a group is evicted when a newer run joins it, whatever the flag says,
# because GitHub keeps one pending run per group. So on main `false` does not protect — it makes
# each push queue, and queueing is what evicts it. merge-window.sh has measured that here all
# along: "on main a queued gate run is cancelled when the next one is created (260 of 264 cancelled
# runs, median gap one second)", and `range_gate` is built around it, treating an older commit's
# gate result as a finding because a per-commit-green rule could essentially never be met.
#
# #2735's remedy — a group per commit on main — is REFUSED here, because the resource is not the
# same one. ci.yml is four ubuntu jobs against an allowance no burst we have can exhaust. This is
# one 46-85 minute macos-15 job against five concurrent jobs for the whole repository, and main is
# a sixth of nothing in that pool: of the 290 runs that consumed a macOS job 2026-11-01..04, 17
# were main. Branch pushes own this pool.
#
# Measured 2026-11-04 across every branch and event: 75.2 of a possible 120 runner-hours used
# (63%), with the pool pegged at five or more concurrent jobs for 594 minutes of the day. Waits are
# bimodal, which is what makes the average lie — median 1.3 min, but 23 of 106 runs waited over 30
# min, ten over an hour, and the worst waited 500. Per-commit groups would add exactly the runs
# that are being evicted today, so the bill is the eviction rate: at the 2026-10-21..28 cadence
# (48.8 main runs/day, 250 evicted) that is +34 runner-hours/day, taking the pool to 110 of 120
# (91%) — and at 63% the worst wait is already 8.3 hours. On a REQUIRED gate that trades missing
# verdicts for multi-hour ones, which is the worse failure.
#
# The cost therefore scales with precisely the cadence that makes the fix necessary, which is the
# inverse of ci.yml and the whole reason the same one-line change does not belong here. At the
# current cadence (5.9 main runs/day since 2026-11-01) it would also buy nothing: zero evictions.
#
# The two cheaper shapes, both measured and neither landed here, both needing #2736 first:
#   - A per-commit group for `workflow_dispatch` only, keeping `push` coalesced. A group per commit
#     for the commits actually being judged, paid for one deliberate ask at a time rather than one
#     merge at a time. Needs #2736's dispatch trigger to exist.
#   - Moving this group onto the `check` job so an evicted commit leaves something to read. Proven
#     on a scratch workflow: the job is evicted identically (cancelled, zero steps) but the run
#     survives, an `always()` verdict job still runs, and the annotation names the sha. Serialising
#     is unchanged, so it costs no macOS minutes. Note two consequences before adopting it — the
#     run concludes `cancelled`, which gate_state still reads as RED and so is fail-closed; and the
#     run then holds a step whose conclusion is `failure`, so any "no failed step means untested"
#     discriminator (ci_abort_state's) would call an eviction RED rather than UNTESTED.
concurrency:
  group: swift-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build-xcframework + fastlane test
    # A branch in this repo already gets the push run; its pull_request run is the same commit again on
    # GitHub's macOS pool, which allows this repo five jobs at once (2026-10-30: 33 queued, ~4 h wait).
    # Pull requests from forks have no push run here, so they keep theirs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    # 46-63 min measured on identical content, the spread being runner draw not diff. The old 60
    # killed runs mid-bundle, which is no verdict rather than a red one; this change took 63.4.
    timeout-minutes: 90
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-core-check
          cache-on-failure: true
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      # The hosted image does not always carry the iPhone 17 simulator runtime, and the lanes' old
      # hardcoded `name=iPhone 17` destination then failed xcodebuild in ~12 s with "Unable to find a
      # device matching the provided destination specifier" (run 41598907652 on main). Name a device
      # this runner actually has: iPhone 17 when it is there, else the newest available iPhone.
      - name: Pick an available simulator
        run: |
          set -euo pipefail
          name="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          names = {d["name"] for devices in json.load(sys.stdin)["devices"].values() for d in devices}
          iphones = [n for n in names if n.startswith("iPhone")]
          if not iphones:
              sys.exit("no iPhone simulator is available on this runner")
          def newest(name):
              model = re.search(r"[0-9]+", name)
              # Highest model number first, and the plain model ahead of its Pro / Plus variants.
              return (int(model.group()) if model else 0, -len(name))
          print("iPhone 17" if "iPhone 17" in iphones else max(iphones, key=newest))
          ')"
          echo "ARBOS_SIM_NAME=$name" >> "$GITHUB_ENV"
          echo "simulator for the test lane: $name"
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-check-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
