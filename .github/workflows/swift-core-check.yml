name: Swift core check

# Compiles arbos-ffi for this commit, then runs ArbosTests via fastlane (no
# signing, no TestFlight upload). Covers the shared client core surface the
# phone embeds as ArbosFFI.

on:
  push:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  # A head whose tip commit is a merge of main has no run here: the merge's own first-parent diff
  # is main's incoming content, which touches none of the paths above, so `push` never fires, and
  # the `pull_request` arm then skips itself because an in-repo branch "already gets the push run".
  # Both triggers defer to the other and the commit goes untested, presenting as skipping, not red.
  # Dispatch is the way to ask for the verdict those two declined, and it needs no new trust from
  # scripts/merge/checks.sh: gate_state already takes the first successful run on a head sha
  # without asking which event produced it.
  #
  # scripts/release/gate-can-decide.sh exists because release-gate.yml's dispatch trigger was a
  # fail-open, and its header names this workflow as the one not to copy that screen into. The
  # reason is that this job needs no pull request: it checks out a commit, builds the xcframework
  # and runs ArbosTests, so a dispatch run is a real verdict on a real tree, exactly as its push
  # runs are. Nothing here reads github.event.pull_request, so there is no fallback to misland.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build-xcframework + fastlane test
    # A branch in this repo already gets the push run; its pull_request run is the same commit again on
    # GitHub's macOS pool, which allows this repo five jobs at once (2026-10-30: 33 queued, ~4 h wait).
    # Pull requests from forks have no push run here, so they keep theirs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    # 46-63 min measured on identical content, the spread being runner draw not diff. The old 60
    # killed runs mid-bundle, which is no verdict rather than a red one; this change took 63.4.
    timeout-minutes: 90
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-core-check
          cache-on-failure: true
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      # The hosted image does not always carry the iPhone 17 simulator runtime, and the lanes' old
      # hardcoded `name=iPhone 17` destination then failed xcodebuild in ~12 s with "Unable to find a
      # device matching the provided destination specifier" (run 41598907652 on main). Name a device
      # this runner actually has: iPhone 17 when it is there, else the newest available iPhone.
      - name: Pick an available simulator
        run: |
          set -euo pipefail
          name="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          names = {d["name"] for devices in json.load(sys.stdin)["devices"].values() for d in devices}
          iphones = [n for n in names if n.startswith("iPhone")]
          if not iphones:
              sys.exit("no iPhone simulator is available on this runner")
          def newest(name):
              model = re.search(r"[0-9]+", name)
              # Highest model number first, and the plain model ahead of its Pro / Plus variants.
              return (int(model.group()) if model else 0, -len(name))
          print("iPhone 17" if "iPhone 17" in iphones else max(iphones, key=newest))
          ')"
          echo "ARBOS_SIM_NAME=$name" >> "$GITHUB_ENV"
          echo "simulator for the test lane: $name"
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-check-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14

  # The one row to read, and the reason scripts/merge/checks.sh is allowed to read this gate at the
  # run level at all. GitHub concludes a run `success` when every job is success-or-skipped, so a
  # run whose check skipped or was killed must carry a job that failed, or the run itself reports a
  # pass for work nobody did. Until now that held only by accident: one job meant a skipped check
  # produced a `skipped` run, which gate_state does not read as a pass. Adding any second job that
  # can succeed while `check` did not is what turns the accident into a fail-open — so the second
  # job added here is the one that cannot.
  #
  # Its condition is `check`'s condition, deliberately copied rather than relaxed: this job runs
  # exactly when `check` was meant to run, and skips with it otherwise. An in-repo pull request
  # still skips both and still concludes `skipped`, so nothing that reads today reads differently
  # and no pull request turns red for the deliberate mirror skip.
  #
  # #2448 carries the full version of this job, with a `route` job and a `push-run` mirror that
  # waits for the twin's verdict. That is the one checks.sh's comments describe and it supersedes
  # this on landing — replace this job with that one wholesale rather than merging them. This is
  # the same guarantee reduced to main's current single-job shape, because the alarm checks.sh
  # tells its reader to treat as impossible is firing routinely today.
  verdict:
    name: Swift verdict
    needs: check
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK" == success ]]; then
            echo "build-xcframework + fastlane test passed on ${GITHUB_SHA:0:9}."
            exit 0
          fi
          echo "::error title=No passing Swift verdict::build-xcframework + fastlane test did not" \
            "pass on ${GITHUB_SHA:0:9} (result: ${CHECK:-none}). Skipped and cancelled are not" \
            "failures to GitHub, so this job fails in their place rather than let the run conclude" \
            "without a verdict."
          exit 1
