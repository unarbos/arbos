name: Swift core check

# Compiles arbos-ffi for this commit, then runs ArbosTests via fastlane (no
# signing, no TestFlight upload). Covers the shared client core surface the
# phone embeds as ArbosFFI.

on:
  push:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"

permissions:
  contents: read

concurrency:
  group: swift-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build-xcframework + fastlane test
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-core-check
          cache-on-failure: true
      - name: uniffi-bindgen version
        id: uniffi
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^uniffi[[:space:]]*=[[:space:]]*"=?([^"]+)".*/\1/p' Cargo.toml | head -1)"
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
      # rust-cache prunes target/, where the script would install uniffi-bindgen, so the binary
      # lives in its own cache and is not rebuilt (about 1.5 min) on every run.
      - name: uniffi-bindgen cache
        id: uniffi-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/uniffi-tools
          key: uniffi-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.uniffi.outputs.version }}
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          UNIFFI_TOOLS_ROOT="$HOME/uniffi-tools" ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      # Saved right after the build, not at job end: a red test step would otherwise skip the save.
      - name: Save uniffi-bindgen cache
        if: steps.uniffi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/uniffi-tools
          key: ${{ steps.uniffi-cache.outputs.cache-primary-key }}
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-check-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
