name: Swift core check

# Compiles arbos-ffi for this commit, then runs ArbosTests via fastlane (no
# signing, no TestFlight upload). Covers the shared client core surface the
# phone embeds as ArbosFFI.

on:
  push:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"

permissions:
  contents: read

# main COALESCES here, and that is a decision, not an oversight. Read this before porting #2735.
#
# The mechanism is the same one #2735 fixed in ci.yml. `cancel-in-progress` governs only a RUNNING
# run; a run still PENDING in a group is evicted when a newer run joins it, whatever the flag says,
# because GitHub keeps one pending run per group. So on main `false` does not protect — it makes
# each push queue, and queueing is what evicts it. merge-window.sh has measured that here all
# along: "on main a queued gate run is cancelled when the next one is created (260 of 264 cancelled
# runs, median gap one second)", and `range_gate` is built around it, treating an older commit's
# gate result as a finding because a per-commit-green rule could essentially never be met.
#
# #2735's remedy — a group per commit on main — is REFUSED here, because the resource is not the
# same one. ci.yml is four ubuntu jobs against an allowance no burst we have can exhaust. This is
# one 46-85 minute macos-15 job, and main is a sixth of nothing in the pool it waits in: of the 290
# runs that consumed a macOS job 2026-11-01..04, 17 were main. Branch pushes own this pool.
#
# THE FIVE-JOB CAP IS REAL, and the ceiling is 120 runner-hours/day. Measured over the 498
# machine-acquiring jobs of 2026-10-29..11-04: 36.2% of all time sits at EXACTLY 5 concurrent
# (3134 min, 52.2 h) and the series never exceeds 6; time at 6 is 102 min, all inside one 47-minute
# span on 10-31 where six long jobs overlapped. An elastic fleet does not pin at exactly five for
# fifty-two hours. Per-day peaks are 5,5,6,5,5,5,5 — the signature of a hard limit.
#
# BEWARE: a sweep that includes never-run jobs reports peak 16 and 533 runner-hours instead, and
# both are phantoms. A job that never got a machine has the placeholder started_at described below
# AND a real completed_at once cancelled, so it appears to occupy a machine for its whole queued
# life. The 223 never-run jobs contribute 102 phantom runner-hours. Filter on runner_name for
# concurrency and consumption too, not only for waits.
#
# Real consumption against the 120 runner-hour ceiling: 10-29 32.9 (27%), 10-30 68.4 (57%),
# 10-31 75.8 (63%), 11-01 85.5 (71%), 11-02 42.3 (35%), 11-03 54.0 (45%).
#
# MEASURING THE WAIT — two traps, both of which cost a wrong answer first time round. A job that
# never gets a machine still reports `started_at`, equal to its `created_at` to the second: it is a
# placeholder, written for real only on machine acquisition. 223 of 726 jobs in this window never
# got one (all 223 have zero steps and no runner_name), so counting them injects 223 fake
# zero-minute waits and halves every percentile. Filter on runner_name, not on conclusion. And
# separate the two latencies, because they have different causes: A = job.started - job.created is
# the wait for a MACHINE; B = job.started - run.created adds the time the run was held PENDING in
# this concurrency group. Over the 503 machine-acquiring jobs, A median 13.9 / p90 209 / max 596,
# B median 21.7 / p90 242 / max 727, and 152 of 503 waited over an hour for a machine.
#
# The split per day is what decides this file. On 10-30, A = B = 596 min at the worst: genuine
# macOS starvation, and this workflow alone consumed 68.4 runner-hours that day. On 11-01..11-03 the
# worst B values are 359, 343 and 727 minutes while their A values are 0.1 — run 41598907652, on
# MAIN, was held in this group for 726 minutes and then got a machine in six seconds. So the long
# main latencies in the current regime are THIS GROUP serialising, not the pool being full.
#
# NOT ALL OF THE WAIT IS OURS, which bounds what any concurrency change here can deliver.
# Allocation is not FIFO. At 17:55Z on 11-04, run 41862996301 (created 15:58:10Z) had been queued
# two hours with runner_name empty and zero steps, while three runs created 44 to 106 minutes LATER
# — 41870076599, 41870349712, 41870386425 — held machines, acquired at 17:41, 17:34 and 17:15. All
# four jobs request labels [macos-15]; the three running ones hold GitHub-hosted runners. So some
# of the wait is GitHub's placement order, and no `group:` expression touches that portion.
#
# Two further runs looked like they had jumped the same queue and had NOT: 41877623803 and
# 41877633751, both on cursor/swift-gate-ec2-mac-ac8d, whose heavy job requests [arbos-mac] and ran
# on the self-hosted runner arbos-ec2-mac — a different pool, never competing for a macos-15
# machine, and in-progress partly on cheap ubuntu-24.04 route jobs. That branch also keys its own
# concurrency on `swift-core-check-v2-`. Compare labels before calling anything non-FIFO; two of
# the five apparent cases here were two pools rather than queue-jumping.
#
# THE DEMAND IS BURSTY ON BRANCHES, NOT ON MAIN. 31 runs were created between 16:43:20Z and
# 16:44:05Z on 11-04 — 18 `push` and 13 `pull_request`, across 18 distinct branches, NONE on main.
# The pull_request halves all concluded `skipped` (the guard below), so the real demand was 18
# macOS jobs in 45 seconds. Note what this is NOT: it is not one merge sequence fanning out, and
# Option A would not prevent any of it, because every one of those runs is a `push` already sitting
# in its own per-ref group. Branch coalescing is working as designed; the burst is 18 agents
# pushing at once. It argues for the capacity refusal above and against nothing else.
#
# A live eviction, for the reader who wants one instance rather than a rate: on this branch run
# 41877441892 concluded `cancelled` after a newer push of this very file joined its group — the
# mechanism eating a real verdict while the file documenting it was being written. Its successor
# then sat queued over 50 minutes, which is the long tail on that 13.9-minute median.
#
# Anything timed on 2026-11-04 after ~16:43Z is contaminated by that backlog (19 queued against 7
# running at 17:55Z) and should be quoted separately rather than blended into the distribution
# above.
#
# Which is the honest shape of the trade, and it is regime-dependent. When cadence is low, machines
# are there and a per-commit group would cost nearly nothing while removing multi-hour verdict
# delays. When cadence is high, the pool is genuinely full and the same change adds the demand
# below to the day that can least carry it. A static per-commit group buys the cheap case and the
# ruinous one together, which is why Option A below — paying only for the commits someone actually
# asks about — is the better middle rather than a compromise.
#
# Per-commit groups would add exactly the runs that are being evicted today, so the bill is the
# eviction rate: at the 2026-10-21..28 cadence (48.8 main runs/day, 250 evicted) that is +34.4
# runner-hours/day. On top of the worst complete day measured (85.5) that is 119.9 of the 120
# runner-hour ceiling — 100%. On a REQUIRED gate that trades missing verdicts for multi-hour ones,
# which is the worse failure.
#
# DO NOT READ THAT 100% AS "WE NEED MORE RUNNERS". Both of these are true and the order matters:
# the cap is real and it is binding UNDER CURRENT CLUSTERING; but the same work spread evenly needs
# only 1.4 to 3.6 of the 5 slots, so remove the clustering and it fits comfortably. The ask this
# data supports is not more machines — it is that we stop standing on our own foot, 64.2% of the
# arrivals being our own fleet against 4.8% from main.
#
# THE WAIT IS CLUSTERING, NOT INSUFFICIENT CAPACITY, and that is the cheapest lever here by far.
# A day's work spread perfectly evenly would need only 1.4 to 3.6 concurrent jobs (its consumed
# runner-hours over 24 h), so every measured day fits inside the cap of 5 with room to spare — the
# worst needs 3.6 of 5 slots. Yet the pool sits saturated at exactly 5 for 273 to 690 minutes a
# day, and while saturated every arrival queues. That saturation is what produces the 209-minute
# p90 wait; nothing was refused for want of total capacity on any day measured.
#
# And the clustering is mostly ours to fix: of 731 arrivals, 64.2% are cursor/* branches, 24.7%
# feedback/*, 6.3% other and 4.8% main, while 39% of all arrivals land within 60 s of another (27%
# within 10 s) against a 128 s median inter-arrival. A minimum-gap policy on our own fleet's pushes
# reaches roughly a third to a half of arrivals and needs no change to this file. No predicted
# minutes are quoted because that needs a queueing model and an uncontaminated sample.
#
# The cost therefore scales with precisely the cadence that makes the fix necessary, which is the
# inverse of ci.yml and the whole reason the same one-line change does not belong here. At the
# current cadence (5.9 main runs/day since 2026-11-01) it would also buy nothing: zero evictions.
#
# The two cheaper shapes, both measured and neither landed here, both needing #2736 first:
#   - A per-commit group for `workflow_dispatch` only, keeping `push` coalesced. A group per commit
#     for the commits actually being judged, paid for one deliberate ask at a time rather than one
#     merge at a time. Needs #2736's dispatch trigger to exist. It cannot remove the part of the
#     wait that is GitHub's allocation order (measured above), and it does nothing about branch
#     bursts, which are `push` events already in their own per-ref groups.
#
#     SEQUENCING, AND THESE TWO DO NOT COMPOSE: cursor/swift-gate-ec2-mac-ac8d rewrites this same
#     block, keying on `swift-core-check-v2-${{ github.ref }}` and routing main, arbos-v2 and
#     open-PR branches to the self-hosted `arbos-mac` pool. A dispatch arm written against
#     `swift-core-check-${{ github.ref }}` is expressed against a world that branch deletes, and
#     its per-commit reasoning does not carry over to a single self-hosted Mac, where one run at a
#     time is the physical limit. WHICHEVER OF THE TWO LANDS SECOND MUST BE REWRITTEN AGAINST THE
#     FIRST. Do not merge them in either order and assume they compose.
#   - Moving this group onto the `check` job so an evicted commit leaves something to read. Proven
#     on a scratch workflow: the job is evicted identically (cancelled, zero steps) but the run
#     survives, an `always()` verdict job still runs, and the annotation names the sha. Serialising
#     is unchanged, so it costs no macOS minutes. It is NOT a workflow-only change, and that is
#     inherent rather than fixable: its signal is a verdict job that fails on purpose, so it
#     manufactures a step concluding `failure`, and at step level that is what a genuine test
#     failure looks like — being visible to GitHub as a failure is the whole design. So
#     ci_abort_state's `grep -qx failure` sends an eviction to RED, and the paired fix belongs in
#     checks.sh, discriminating on the heavy job's own `cancelled` conclusion rather than on a job
#     name someone can rename. Land it after #2733 and bring the kit change with it. Fail-closed
#     throughout either ordering: the run still concludes `cancelled`, and gate_state reads that as
#     RED regardless, so the cost of the wrong order is evictions reading as reds, not a bad merge.
concurrency:
  group: swift-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build-xcframework + fastlane test
    # A branch in this repo already gets the push run; its pull_request run is the same commit again on
    # GitHub's macOS pool, which allows this repo five jobs at once (2026-10-30: 33 queued, ~4 h wait).
    # Pull requests from forks have no push run here, so they keep theirs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    # 46-63 min measured on identical content, the spread being runner draw not diff. The old 60
    # killed runs mid-bundle, which is no verdict rather than a red one; this change took 63.4.
    timeout-minutes: 90
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-core-check
          cache-on-failure: true
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      # The hosted image does not always carry the iPhone 17 simulator runtime, and the lanes' old
      # hardcoded `name=iPhone 17` destination then failed xcodebuild in ~12 s with "Unable to find a
      # device matching the provided destination specifier" (run 41598907652 on main). Name a device
      # this runner actually has: iPhone 17 when it is there, else the newest available iPhone.
      - name: Pick an available simulator
        run: |
          set -euo pipefail
          name="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          names = {d["name"] for devices in json.load(sys.stdin)["devices"].values() for d in devices}
          iphones = [n for n in names if n.startswith("iPhone")]
          if not iphones:
              sys.exit("no iPhone simulator is available on this runner")
          def newest(name):
              model = re.search(r"[0-9]+", name)
              # Highest model number first, and the plain model ahead of its Pro / Plus variants.
              return (int(model.group()) if model else 0, -len(name))
          print("iPhone 17" if "iPhone 17" in iphones else max(iphones, key=newest))
          ')"
          echo "ARBOS_SIM_NAME=$name" >> "$GITHUB_ENV"
          echo "simulator for the test lane: $name"
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-check-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
