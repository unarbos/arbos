name: Swift core check

# Compiles arbos-ffi for this commit, then runs ArbosTests via fastlane (no
# signing, no TestFlight upload). Covers the shared client core surface the
# phone embeds as ArbosFFI.

# The push trigger filters nothing, and that is the whole correctness argument of this workflow.
#
# A `paths:` filter here is evaluated on the pushed commit's two-dot diff, while whether this gate
# APPLIES is judged on the pull request's three-dot diff — scripts/merge/checks.sh's gate_applies,
# because the three-dot diff is what the merge would bring. A branch that touches a gated path
# early and then lands a final push outside those paths therefore ended up with a head the gate
# applies to and no run that could ever answer it, presenting as all-green with nothing red. See
# scripts/release/swift-gate-applies.sh for the measured case (#2751 at f4f010268).
#
# So every push starts a run, and the `decide` job below works out on the same three-dot diff
# whether the macOS job is needed. The pull_request list stays: checks.sh reads the quoted patterns
# under this `on:` block to learn the gate's scope and BLOCKS on a block it can read but finds
# empty, so this is the one declaration of what the gate covers.
on:
  push:
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "crates/arbos-matrix/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "assets/avatars/leaves/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-core-check.yml"
  # A head whose tip commit is a merge of main has no run here: the merge's own first-parent diff
  # is main's incoming content, which touches none of the paths above, so `push` never fires, and
  # the `pull_request` arm then skips itself because an in-repo branch "already gets the push run".
  # Both triggers defer to the other and the commit goes untested, presenting as skipping, not red.
  # Dispatch is the way to ask for the verdict those two declined, and it needs no new trust from
  # scripts/merge/checks.sh: gate_state already takes the first successful run on a head sha
  # without asking which event produced it.
  #
  # scripts/release/gate-can-decide.sh exists because release-gate.yml's dispatch trigger was a
  # fail-open, and its header names this workflow as the one not to copy that screen into. The
  # reason is that this job needs no pull request: it checks out a commit, builds the xcframework
  # and runs ArbosTests, so a dispatch run is a real verdict on a real tree, exactly as its push
  # runs are. Nothing here reads github.event.pull_request, so there is no fallback to misland.
  workflow_dispatch:

permissions:
  contents: read

# Unfiltered pushes also repair this group. A push that created no run joined no group and so
# displaced nothing: run 41918138101 was still building c187a9c00 forty-five minutes after that sha
# stopped being the branch tip, holding a runner to judge superseded content.
concurrency:
  group: swift-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  decide:
    name: Swift core check applies?
    # A branch in this repo gets the push run, so its pull_request run would be the same commit
    # again on GitHub's macOS pool, which allows this repo five jobs at once (2026-10-30: 33
    # queued, ~4 h wait; 2026-11-04: 2 h 25 min from queue to first job). Pull requests from forks
    # have no push run here, so they keep theirs. That deferral is only sound because the push
    # trigger above filters nothing — when it filtered paths, the push run it defers to did not
    # always exist, and that is what turned the deferral into a missing verdict.
    #
    # The deferral is declared HERE, on the first job, and not on the macOS job it is about. A run
    # is only "skipped" when every job in it skipped; one cheap job succeeding beside a skipped
    # macOS job concludes the whole run "success". scripts/merge/checks.sh reads that run-level
    # conclusion, so a guard on the macOS job alone turns a correctly-read missing verdict into a
    # silent pass — the exact failure this workflow exists to prevent. Measured on 6f3061016:
    # run 41926276679 concluded success with build-xcframework skipped. `check` needs `decide`,
    # so skipping here skips the run entirely and it still reads as no verdict.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    outputs:
      applies: ${{ steps.applies.outputs.applies }}
    steps:
      # The three-dot diff needs the merge base, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The screen's own invariants
        run: ./scripts/release/swift-gate-applies.sh selftest
      - name: Does the gate apply to this commit?
        id: applies
        run: ./scripts/release/swift-gate-applies.sh decide

  check:
    name: build-xcframework + fastlane test
    needs: decide
    # This gate's scope, decided on the three-dot diff rather than on what the trigger happened to
    # fire for. A head the gate applies to always reaches this job. Deduplication is not repeated
    # here: it lives on `decide`, which this job needs, for the run-conclusion reason given there.
    if: needs.decide.outputs.applies == 'true'
    runs-on: macos-15
    # 46-63 min measured on identical content, the spread being runner draw not diff. The old 60
    # killed runs mid-bundle, which is no verdict rather than a red one; this change took 63.4.
    timeout-minutes: 90
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-core-check
          cache-on-failure: true
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      # The hosted image does not always carry the iPhone 17 simulator runtime, and the lanes' old
      # hardcoded `name=iPhone 17` destination then failed xcodebuild in ~12 s with "Unable to find a
      # device matching the provided destination specifier" (run 41598907652 on main). Name a device
      # this runner actually has: iPhone 17 when it is there, else the newest available iPhone.
      - name: Pick an available simulator
        run: |
          set -euo pipefail
          name="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          names = {d["name"] for devices in json.load(sys.stdin)["devices"].values() for d in devices}
          iphones = [n for n in names if n.startswith("iPhone")]
          if not iphones:
              sys.exit("no iPhone simulator is available on this runner")
          def newest(name):
              model = re.search(r"[0-9]+", name)
              # Highest model number first, and the plain model ahead of its Pro / Plus variants.
              return (int(model.group()) if model else 0, -len(name))
          print("iPhone 17" if "iPhone 17" in iphones else max(iphones, key=newest))
          ')"
          echo "ARBOS_SIM_NAME=$name" >> "$GITHUB_ENV"
          echo "simulator for the test lane: $name"
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-check-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14

  # CONSTRAINT — this is the "matching constraint comment on the workflow side" that
  # scripts/merge/checks.sh's gate_state header points at, and which was missing from this file.
  #
  # gate_state reads this gate's RUN conclusion rather than a named check row, and GitHub concludes
  # a run `success` when every job is success-or-skipped. So a run conclusion equals a real verdict
  # only while no job here can succeed without testing. Until now that held by accident of
  # arithmetic: one job meant a skipped check produced a `skipped` run, which gate_state does not
  # read as a pass. The accident becomes a fail-open the moment this file gains a second job that
  # can succeed while `check` did not — so the second job added here is the one that cannot, and
  # that is the invariant anyone adding a third job has to preserve. Do not give this job
  # `continue-on-error: true`, and do not add a job that always succeeds.
  #
  # TWO NARROWINGS from the `if: always()` checks.sh describes. Both only ever withhold a failure,
  # never add a pass, so the invariant above survives them — but they are narrowings, and a third
  # job added later has to respect what they leave open. See the requirement at the end.
  #
  # `!cancelled()` rather than `always()`. On main, 264 of this workflow's 428 runs concluded
  # `cancelled` against 87 failed and 77 passed, because a queued run in a concurrency group is
  # evicted when the next is created — documented at scripts/merge/merge-window.sh:182-184 as "260
  # of 264 cancelled runs, median gap one second", and the reason range_gate treats an intermediate
  # red as a finding rather than a refusal. With always(), this job would run on each of those and
  # fail it, turning 264 known-benign evictions on main into red. gate_state already reads
  # `cancelled` as RED, so nothing is gained for the cost of quadrupling main's failure count, and
  # an alarm that fires routinely is an alarm that gets reclassified.
  #
  # `check`'s own condition, copied verbatim. Bare always() would fail every in-repo pull request
  # run, where `check` skips by design because the push twin covers it; #2448 can afford always()
  # only because its `push-run` mirror supplies the twin's verdict in that case. So this job runs
  # exactly when `check` was meant to run, and skips alongside it otherwise.
  #
  # REQUIREMENT ON ANY THIRD JOB. Because this job skips when `check` skips, a third job that
  # succeeds while both are skipped would make the run conclude `success` with nothing tested —
  # the fail-open, back again. So a third job must either skip whenever `check` skips, or fail
  # closed itself. #2448's version does not need that caveat, which is one more reason it should
  # replace this wholesale rather than be merged with it.
  #
  # #2448 carries the full version, with a `route` job and a `push-run` mirror that waits for the
  # twin's verdict, and that is the one checks.sh's comments describe. This is the same guarantee
  # reduced to main's current single-job shape, because the branch checks.sh tells its reader is
  # unreachable is in fact reachable, and fires today.
  verdict:
    name: Swift verdict
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK" == success ]]; then
            echo "build-xcframework + fastlane test passed on ${GITHUB_SHA:0:9}."
            exit 0
          fi
          echo "::error title=No passing Swift verdict::build-xcframework + fastlane test did not" \
            "pass on ${GITHUB_SHA:0:9} (result: ${CHECK:-none}). Skipped and cancelled are not" \
            "failures to GitHub, so this job fails in their place rather than let the run conclude" \
            "without a verdict."
          exit 1
