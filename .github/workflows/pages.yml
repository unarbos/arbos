name: Website

# Deploys www/ to the Cloudflare Pages project "arbos-life" (https://arbos.life).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Pull requests get a preview URL; main goes live.

on:
  push:
    branches: [main]
    paths: ["www/**", "deploy/www/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["www/**", "deploy/www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML
        run: |
          set -euo pipefail
          for f in $(find www -name '*.html'); do
            grep -q '<html lang="en">' "$f"
            grep -q '<meta name="viewport"' "$f"
          done
          test -f www/_headers

      # /download/mac must land on a real, published file. Pick it now so the
      # deployed _redirects and download/mac.json agree with GitHub releases.
      - name: Pick the Mac download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p www/download
          python3 deploy/www/mac-download.py \
            --json www/download/mac.json \
            --redirect-pages www/_redirects
          tail -1 www/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy www
            --project-name=arbos-life
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
