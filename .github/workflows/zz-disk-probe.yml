name: zz disk probe

# TEMPORARY. Deleted before this branch's pull request. Measures where the rust job's disk goes on
# a hosted ubuntu-24.04 runner, because the job dies inside Swatinem/rust-cache's restore and takes
# the runner's own worker with it, so it uploads no log of its own.

on:
  workflow_dispatch:
  push:
    branches: ["cursor/rust-gate-disk-exhaustion-b608"]
    paths: [".github/workflows/zz-disk-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    name: Where the disk goes
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: A poller, so a death by full disk still leaves a measurement
        run: |
          set -euo pipefail
          cat > /tmp/poll.sh <<'POLL'
          while :; do echo "$(date -u +%H:%M:%S) $(df -B1M --output=avail / | tail -1) MiB free"; sleep 5; done
          POLL
          nohup bash /tmp/poll.sh > /tmp/avail.log 2>&1 &
          echo "started"
      - name: Baseline
        run: |
          set -euo pipefail
          echo "## filesystems"; df -h / /mnt 2>/dev/null || df -h
          echo "## what the image is holding on /"
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                   /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift \
                   /usr/local/share/chromium /usr/local/lib/node_modules /opt/az \
                   /usr/share/miniconda /var/lib/docker /opt/pipx /usr/share/java; do
            if [ -e "$d" ]; then du -sh "$d" 2>/dev/null || true; fi
          done
          echo "## docker images"; docker image ls --format '{{.Size}}\t{{.Repository}}' 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: After the toolchain
        run: df -h /; du -sh ~/.rustup ~/.cargo 2>/dev/null || true
      - name: Linux libraries for arbos-mac (GPUI)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-xkb-dev libasound2-dev libssl-dev libgl1-mesa-dev libfontconfig-dev libstdc++-14-dev libglib2.0-dev
      - name: clang 21 for webrtc-sys
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21 >/dev/null
          echo "CC=/usr/lib/llvm-21/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-21/bin/clang++" >> "$GITHUB_ENV"
      - name: After apt and clang 21
        run: df -h /; du -sh /usr/lib/llvm-21 2>/dev/null || true
      - name: cargo fetch
        run: cargo fetch --locked
      - name: After fetch
        run: df -h /; du -sh ~/.cargo ~/.cargo/registry 2>/dev/null || true
      - name: clippy, the real one
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: After clippy — this is the peak the cache has to hold
        run: |
          df -h /
          du -sh target ~/.cargo
          du -sh target/* 2>/dev/null | sort -h | tail -10
      - name: test build
        run: cargo test --workspace --locked --no-run
      - name: After the test build
        run: df -h /; du -sh target ~/.cargo
      - name: The poller's view
        if: always()
        run: |
          echo "## free space on / over the run, every 5s"
          cat /tmp/avail.log || true
