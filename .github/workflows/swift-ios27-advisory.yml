name: Swift iOS 27 (advisory)

# DISABLED SINCE 2026-10-31, AND NOT CURRENTLY RUNNING. GitHub holds this workflow in
# `disabled_manually` state, so neither trigger below fires; its last run of any kind was
# 2026-10-31T23:08Z. Nothing refuses on its absence — it is not a gate in scripts/merge/checks.sh —
# so the iOS 27 coverage this file describes is NOT being obtained today, and has not been for the
# whole time this notice has been missing from it.
#
# It is staying off because it almost never finished: 8 of its 53 lifetime runs succeeded, and 39
# were cancelled. Read that with its dates — all 53 ran on 2026-10-31, so this lane was added, ran
# for a single day and was switched off the same day. It has never had a longer trial than that.
# 8 of those runs were cancelled within ten seconds of each other and 7 more within ninety, across
# fifteen branches, immediately before it went quiet. Why so many were cancelled is not yet
# understood, and that is the open question gating any re-enable — a low-priority item to drain,
# not a decision waiting on anyone. Who switched it off is recorded nowhere: this repo is a User
# account, so it has no audit log.
#
# `Swift core check` (.github/workflows/swift-core-check.yml) is the only live Swift gate on push
# and pull request, and it runs on GitHub's hosted `macos-15`. Neither Swift check runs on the
# self-hosted EC2 Mac: `arbos-mac` is the default runner for ios.yml's TestFlight lane and for
# ios-capture.yml, and release.yml's Mac job uses it when `vars.ARBOS_MAC_RUNNER` selects it.
#
# What this lane covers when it is switched on, which is still accurate and still worth reading:
#
# The Swift core check's build and `fastlane test`, on GitHub's hosted `xcode-27` image (a public
# preview): the toolchain and simulator testers' builds meet, which the macos-15 gate has neither of
# (Xcode 26.3, iOS 26.2). Advisory only. It is its own workflow file so nothing in it can feed the
# Swift core check's jobs or its verdict: a red, cancelled or queued run here says nothing about
# that check.

on:
  push:
    branches: [main]
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-ios27-advisory.yml"
  pull_request:
    paths:
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "scripts/build-xcframework.sh"
      - "packages/ArbosFFI/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/ios/Arbos/**"
      - ".github/workflows/swift-ios27-advisory.yml"

permissions:
  contents: read

concurrency:
  group: swift-ios27-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is `check`, as in swift-core-check.yml, because rust-cache keys on the job id: that is
  # what lets this job find the gate's Rust cache.
  check:
    name: xcode-27 build + fastlane test (advisory)
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      APP_DIR: apps/ios/Arbos
    steps:
      - uses: actions/checkout@v4
      # Read-only: the gate's caches are restored, never saved. A misbehaving preview image must not
      # write a key the gate restores.
      - name: Swift package cache (restore only)
        uses: actions/cache/restore@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'packages/ArbosFFI/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          # Pinned to the Xcode the build Mac archives TestFlight builds with (27.0, 27A266a); the
          # image's default is 27.1. When the build Mac moves to another Xcode, this pin and the build
          # number below have to move with it, or this lane stops testing what testers install.
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          xcodebuild -version | grep -q 'Build version 27A266a' || {
            echo "::error title=Xcode 27.0 is not 27A266a::the image's Xcode_27.0.app changed; check it against the build Mac"
            exit 1
          }
          xcrun simctl list devices available | grep -E '^-- iOS|iPhone 17 \(' || true
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      # Keyed exactly as the gate keys it in swift-core-check.yml, for the same reason the job id
      # is `check`: both go into rust-cache's key, and this job finds the gate's cache only by
      # composing the identical string. The two must move together. `rustc -vV` goes into the key
      # here as it does there, so if this preview image ever carries a different compiler the key
      # simply does not match and this job builds cold — which is what the environment hash did
      # before, and the right answer either way: the gate's artifacts cannot answer for another
      # compiler.
      - name: Cache key for the dependency build
        id: cache-key
        run: |
          set -euo pipefail
          rustc -vV
          lines=$(grep -cE '^(source|checksum) = ' Cargo.lock)
          if [ "$lines" -lt 100 ]; then
            echo "::error title=Cache key::Cargo.lock yielded $lines source/checksum lines, too few to be the dependency set. The cache key no longer tracks what it caches."
            exit 1
          fi
          echo "$lines external dependency lines in Cargo.lock"
          deps=$(grep -E '^(source|checksum) = ' Cargo.lock | shasum -a 256 | cut -c1-16)
          rust=$( { rustc -vV; cat rust-toolchain.toml; echo "RUSTFLAGS=${RUSTFLAGS:-}"; cat .cargo/config.toml 2>/dev/null || true; } | shasum -a 256 | cut -c1-16)
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      # Read-only, as the Swift package cache above is: a misbehaving preview image must not write
      # a key the gate restores.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: swift-core-check-${{ steps.cache-key.outputs.rust }}-${{ steps.cache-key.outputs.deps }}
          save-if: false
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d packages/ArbosFFI/ArbosFFIRust.xcframework
          test -f packages/ArbosFFI/Sources/ArbosFFI/ArbosFFI.swift
      - name: fastlane test
        env:
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          fastlane test
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios27-advisory-logs-${{ github.sha }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
      # The app's own stdout from a UI test is only in the result bundle, not in the xcodebuild log.
      # Bundles are large, so only a run that did not succeed keeps one, and not for long. That
      # includes a cancelled run, but a job killed by timeout-minutes may not give this step time to
      # run, so for a hang that is best-effort, not guaranteed.
      - name: Keep the xcresult bundle (runs that did not succeed)
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios27-advisory-xcresult-${{ github.sha }}
          path: apps/ios/Arbos/build/dd/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 3
