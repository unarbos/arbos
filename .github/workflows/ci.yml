name: CI

# Linux gate for the workspace (D43). `Release` runs after this succeeds on
# main (workflow_run), so a red commit never ships. Feature branches get CI
# on push, without a pull request.

on:
  # The feedback loop dispatches CI on a gate/** branch when GitHub ran nothing for
  # it (a branch created through the API without a new commit raises no push event).
  workflow_dispatch:
  push:
    # gate/** = the feedback loop's integration branches (current main + the ready
    # fix branches); this run is the Linux half of its pre-merge gate.
    branches: [main, arbos-v2, "cursor/**", "gate/**"]
    # The phone app has its own workflow (ios.yml); an apps/ios-only push needs
    # no Rust gate and no Mac release.
    paths-ignore: ["apps/ios/**"]
  pull_request:

permissions:
  contents: read

# A newer push cancels an older run on a branch, but never on main: release.yml only runs after
# a successful CI on main, and a cancelled run means no release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  layout:
    name: Layout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The tree is the monorepo, and the old pipeline is gone
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f crates/arbos-mac/Cargo.toml
          test -f crates/arbos-update/update-key.pub
          grep -q '^ed25519 ' crates/arbos-update/update-key.pub
          test -f scripts/bundle-mac.sh
          test -f scripts/release/publish-release.sh
          test -f image/Dockerfile
          # Release main / fx-* published `edge` from the previous tree; with
          # the monorepo landed they must not exist, or two pipelines would
          # write the same release.
          test ! -e .github/workflows/release-main.yml
          test ! -e .github/workflows/fx-binary-size.yml
          test ! -e .github/workflows/fx-startup.yml
          test ! -e app
          test ! -e fx
      - name: Workflow and shell lint
        run: |
          set -euo pipefail
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning scripts/*.sh scripts/release/*.sh scripts/runner/*.sh scripts/feedback/*.sh image/*.sh
          # One avatar resolver on both platforms (ARB-394): no surface draws an agent picture outside it.
          ./scripts/avatar-lint.sh
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp >/dev/null
          /tmp/actionlint -color

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for arbos-mac (GPUI)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-xkb-dev libasound2-dev libssl-dev libgl1-mesa-dev libfontconfig-dev libstdc++-14-dev libglib2.0-dev
      # Calls v1: the `livekit` crate links a prebuilt libwebrtc whose hermetic libc++
      # needs clang ≥ 21 to compile the cxx bridge (webrtc-sys refuses GCC / older clang).
      - name: clang 21 for webrtc-sys
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21 >/dev/null
          echo "CC=/usr/lib/llvm-21/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-21/bin/clang++" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Shared client DTOs (arbos-core #[typeshare]) → packages/ArbosFFI RelayTypes.swift.
      - name: Generated Swift relay types are fresh
        run: |
          set -euo pipefail
          cargo install typeshare-cli --version 1.13.4 --locked
          ./scripts/gen-swift-types.sh
          git diff --exit-code -- packages/ArbosFFI/Sources/ArbosFFI/RelayTypes.swift
      # arbos-client is app-only: only arbos-mac and arbos-ffi may depend on it
      # (not relay/agentd/ctl/local).
      - name: arbos-client dependents
        run: |
          set -euo pipefail
          deps=$(cargo tree -i arbos-client --prefix none --depth 1 | awk '/^arbos-/ {print $1}' | grep -v '^arbos-client$' | sort -u)
          test "$deps" = $'arbos-ffi\narbos-mac'
      # arbos-matrix (D88 C1) is app-only too: the relay has its own appservice client.
      - name: arbos-matrix dependents
        run: |
          set -euo pipefail
          deps=$(cargo tree -i arbos-matrix --prefix none --depth 1 | awk '/^arbos-/ {print $1}' | grep -v '^arbos-matrix$' | sort -u)
          test "$deps" = $'arbos-ffi' || test "$deps" = $'arbos-ffi\narbos-mac'

  harness:
    name: harness (arbos-pi-ext typecheck + build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - run: pnpm -r typecheck
        working-directory: harness
      - run: pnpm -r build
        working-directory: harness
      - run: pnpm -r test
        working-directory: harness

  image:
    name: image (dockerfile lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [rust, harness]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: image/Dockerfile
          failure-threshold: error
