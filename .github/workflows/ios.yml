name: iOS

# The phone app (apps/ios/Arbos) to TestFlight. Only pushes to `main` that
# touch it upload; pushes to `arbos-v2` and `cursor/**` archive without
# uploading (a branch push must never produce a duplicate TestFlight build);
# workflow_dispatch chooses. The work is the fastlane lanes in apps/ios/Arbos/fastlane
# (`archive`, `beta`): archive with signing off, then exportArchive with
# App Store Connect automatic signing and the API key.
#
# Secrets: AC_API_KEY_P8, AC_API_KEY_ID, AC_API_ISSUER_ID (the App Store
# Connect key named "Arbos IOS", id ZV82D3ZWRT — the "arbos ci" key cannot
# cloud-sign), ARBOS_APPLE_TEAM_ID (25SCF3Q2AK). An upload failure fails the
# job: a silent TestFlight miss is worse than a red check.
#
# Build number: UTC YYYYMMDDHHMM. It always rises, and it is above the builds
# already on TestFlight (202610150502 at the time of writing).
#
# After the upload, `fastlane distribute` waits for Apple to process the build,
# adds it to the external group(s) in the TESTFLIGHT_GROUPS repository variable
# (default "Arbos public", public link https://testflight.apple.com/join/ec5fWCuJ)
# and submits it for Beta App Review; the internal group sees every build on
# its own. The step runs only when the build was uploaded (main / dispatch).
#
# The lanes print every xcodebuild line and write build/xcodebuild-<lane>.log;
# the last step keeps those logs as an artifact, pass or fail.

on:
  push:
    branches: [main, arbos-v2, "cursor/**"]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      # Arbos embeds ArbosFFI (arbos-ffi); Rust/client changes must rebuild TestFlight.
      - "crates/arbos-core/**"
      - "crates/arbos-client/**"
      - "crates/arbos-ffi/**"
      - "scripts/build-xcframework.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      # The phone bundles the tree avatars: an art drop is a new TestFlight build.
      - "assets/avatars/trees/manifest.json"
      - "assets/avatars/trees/lottie/**"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off = archive only)"
        type: boolean
        default: true

permissions:
  contents: read

# A newer push cancels an older run on a branch. On main every push is its own
# group (keyed by the commit), so nothing is cancelled or coalesced: every push
# to main is a TestFlight build the feedback loop (scripts/feedback) waits for.
concurrency:
  group: ios-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  phone:
    name: Build and upload the phone app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_DIR: apps/ios/Arbos
      HAVE_OP: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
      UPLOAD: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) ||
            (github.event_name == 'push' && github.ref_name == 'main') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build number
        id: build
        run: echo "number=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: apps/ios/Arbos/build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Arbos/Arbos.xcodeproj/project.pbxproj', 'apps/ios/Arbos/Arbos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [[ -n "$newest" ]]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-arbos-ffi
          cache-on-failure: true
      - name: Build ArbosFFI xcframework
        run: |
          set -euo pipefail
          ./scripts/build-xcframework.sh
          test -d target/xcframework/ArbosFFI.xcframework
          test -f target/xcframework/ArbosFFI.swift
      - name: Archive, and upload to TestFlight when this ref ships
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          ARBOS_APPLE_TEAM_ID: ${{ secrets.ARBOS_APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          ARBOS_SPM_DIR: ${{ github.workspace }}/apps/ios/Arbos/build/spm
        run: |
          set -euo pipefail
          set +x
          if [[ ! -d "$APP_DIR/Arbos.xcodeproj" ]]; then
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              echo "::error title=No iOS project::$APP_DIR/Arbos.xcodeproj is not in this tree."
              exit 1
            fi
            echo "::notice title=No iOS project on this branch::$APP_DIR is not here yet; nothing to build."
            exit 0
          fi
          if [[ ! -f "$APP_DIR/fastlane/Fastfile" ]]; then
            echo "::error title=No Fastfile::$APP_DIR/fastlane/Fastfile is missing; the lanes archive and beta are what this job runs."
            exit 1
          fi
          cd "$APP_DIR"
          if [[ "$UPLOAD" != "true" ]]; then
            echo "==> fastlane archive (build $BUILD_NUMBER, no upload on $GITHUB_REF_NAME)"
            fastlane archive
            echo "Archived build $BUILD_NUMBER; not uploaded (ref $GITHUB_REF_NAME)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=0
          for name in AC_API_KEY_P8 AC_API_KEY_ID AC_API_ISSUER_ID ARBOS_APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Apple secret missing::$name is not set."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          if [[ "$AC_API_KEY_ID" != "ZV82D3ZWRT" ]]; then
            echo "::warning title=Unexpected App Store Connect key::AC_API_KEY_ID is $AC_API_KEY_ID; the key that can cloud-sign the phone app is \"Arbos IOS\" (ZV82D3ZWRT)."
          fi
          # The lane accepts the key as text (AC_API_KEY_P8) or a file; hand it
          # a 0600 file in $RUNNER_TEMP so the text never reaches a command line.
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_$AC_API_KEY_ID.p8"
          if printf '%s' "$AC_API_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$AC_API_KEY_P8" > "$key_path"
          else
            printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$key_path"
          fi
          trap 'rm -f "$key_path"' EXIT
          echo "==> fastlane beta (build $BUILD_NUMBER)"
          AC_API_KEY_P8="" AC_API_KEY_PATH="$key_path" fastlane beta
          echo "TestFlight upload finished: build $BUILD_NUMBER (com.unarbos.arbos.ios)." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for processing, add the build to the external group, submit for Beta App Review
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) ||
              (github.event_name == 'push' && github.ref_name == 'main') }}
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS || 'Arbos public' }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          set +x
          cd "$APP_DIR"
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_$AC_API_KEY_ID.p8"
          if printf '%s' "$AC_API_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$AC_API_KEY_P8" > "$key_path"
          else
            printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$key_path"
          fi
          trap 'rm -f "$key_path"' EXIT
          # What to test = the first line of the commit message.
          CHANGELOG="$(printf '%s' "$CHANGELOG" | head -1)" AC_API_KEY_P8="" AC_API_KEY_PATH="$key_path" fastlane distribute
          echo "Build $BUILD_NUMBER added to TestFlight group(s) $TESTFLIGHT_GROUPS and submitted for Beta App Review." >> "$GITHUB_STEP_SUMMARY"
      # Continuous delivery (D85): the build is processed and in the tester group, so the relay
      # learns about it (GET /releases/current → the app's "Update available" card; push
      # `release_published`). Best effort — TestFlight already has the build.
      - name: Relay admin token from 1Password
        if: env.UPLOAD == 'true' && env.HAVE_OP == 'true'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ARBOS_RELAY_ADMIN_TOKEN: op://Arbos/pjwsl7tjrhcbzbqos2masde2u4/credential
      - name: Tell the relay
        if: env.UPLOAD == 'true'
        env:
          ARBOS_RELAY_ADMIN_TOKEN: ${{ env.ARBOS_RELAY_ADMIN_TOKEN || secrets.ARBOS_RELAY_ADMIN_TOKEN }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          RELAY_URL: ${{ vars.ARBOS_RELAY_URL || 'https://relay.arbos.life' }}
        run: |
          set +x
          if [[ -z "${ARBOS_RELAY_ADMIN_TOKEN:-}" ]]; then
            echo "::warning::no relay admin token; the phones will not see the Update card until the next build that reports it"
            exit 0
          fi
          version="$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' "$APP_DIR/Arbos.xcodeproj/project.pbxproj" | head -1)"
          body="$(printf '{"platform":"ios","channel":"testflight","version":"%s","build":"%s","url":"%s"}' \
            "${version:-1.0.0}" "$BUILD_NUMBER" "https://testflight.apple.com/join/ec5fWCuJ")"
          if curl -fsS --max-time 30 -X POST "$RELAY_URL/admin/release" \
               -H "Authorization: Bearer $ARBOS_RELAY_ADMIN_TOKEN" -H "content-type: application/json" -d "$body"; then
            echo; echo "relay told: TestFlight $BUILD_NUMBER"
          else
            echo "::warning::relay did not accept the release notice (older relay?); the Update card waits for the next build"
          fi
      - name: Keep the xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ steps.build.outputs.number }}
          path: apps/ios/Arbos/build/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 14
