name: Mac compile check

# Type-checks the Mac app on a Mac. `cargo check -p arbos-mac --all-targets --locked`, which is the
# one thing no Linux runner can do for this tree.
#
# ── the hole this closes ───────────────────────────────────────────────────────────────────────
# ci.yml builds arbos-mac on ubuntu-24.04, so the crate compiles on every pull request — as its
# LINUX configuration. `crates/arbos-mac` carries 119 `#[cfg(target_os = "macos")]` sites and
# `crates/arbos-update` 8 more, and a Linux compile reads none of them: cfg'd-out code is not type
# checked, only parsed. Over main's last 348 substantive first-parent commits, 184 (53%) touch
# `crates/arbos-mac`, and every one of them merged with its Mac-only half never compiled by any
# check. The first compile happens in release.yml, after the merge, on the critical path of a
# publish — which is where a Mac-only error turns into a broken release with every check green.
#
# ── why a macOS runner and not a cross-compile ─────────────────────────────────────────────────
# `cargo check -p arbos-mac --target aarch64-apple-darwin` on ubuntu-24.04 dies in `ring`'s C build
# for want of the macOS SDK, before reaching a line of this repo's code. The SDK is not
# redistributable, so there is no Linux job that can answer this question.
#
# ── what it does NOT cover, said out loud ──────────────────────────────────────────────────────
# `cargo check` type-checks; it does not link. An objc selector that does not exist at runtime, a
# missing framework, a dSYM or codesign problem are all still release.yml's to find. It also does
# not build `crates/arbos-sidecar` (2 Apple cfg sites), which is not in arbos-mac's dependency
# closure. This is the cheap 90% of the gap, not the whole of it.
#
# ── the push trigger filters nothing, and that is deliberate ───────────────────────────────────
# Identical reasoning to .github/workflows/swift-core-check.yml, which measured the failure: a
# `paths:` filter on `push` is evaluated on the pushed commit's two-dot diff, while whether a gate
# APPLIES is judged on the pull request's three-dot diff. A branch that touches a gated path early
# and lands a final push outside those paths then has a head the gate applies to and no run that
# can answer it — all green, nothing red, and nothing compiled. So every push starts a run and the
# `decide` job below works out, on the three-dot diff, whether the macOS job is needed.
#
# The `pull_request` list stays because scripts/merge/checks.sh reads the quoted patterns under
# this `on:` block to learn a gate's scope, and BLOCKS on a block it can read but finds empty.
# This is the one declaration of what this gate covers.
#
# ── the scope, and why it is narrower than the Mac app's source closure ────────────────────────
# `crates/arbos-mac` and `crates/arbos-update` are where every Apple cfg site in this workspace
# lives outside arbos-sidecar; `arbos-core`, `arbos-client` and `arbos-matrix` have none at all,
# and the Swift core check already compiles those three for an Apple target on every change to
# them. Adding them here would fire this job on 58% of commits instead of 53% and take a second
# macOS slot on the 48% that already take one for the Swift gate, to compile crates that have no
# Apple-specific code of their own. The residual risk it leaves is real and small: an arbos-core
# API change used ONLY inside arbos-mac's `#[cfg(target_os = "macos")]` code is not caught here
# until something touches arbos-mac. Widen the list if that ever actually happens.
on:
  push:
  pull_request:
    paths:
      - "crates/arbos-mac/**"
      - "crates/arbos-update/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mac-check.yml"
      - "scripts/release/swift-gate-applies.sh"

permissions:
  contents: read

concurrency:
  group: mac-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  decide:
    name: Mac compile check applies?
    # A branch in this repo gets the push run, so its pull_request run would be the same commit
    # again on a hosted macOS pool that allows this repo five jobs at once. Fork pull requests have
    # no push run here, so they keep theirs.
    #
    # The deferral is declared HERE, on the first job, not on the macOS job it is about: a run is
    # only "skipped" when EVERY job in it skipped, so one cheap job succeeding beside a skipped
    # macOS job concludes the whole run `success`, which scripts/merge/checks.sh reads as a pass.
    # `check` needs `decide`, so skipping here skips the run entirely and it still reads as no
    # verdict. Measured on the Swift gate at 6f3061016 before that gate moved its own guard here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      applies: ${{ steps.applies.outputs.applies }}
    env:
      # The screen defaults to the Swift gate, and refuses when the workflow it is told to decide
      # is not the workflow it is running in.
      GATE_WF: .github/workflows/mac-check.yml
    steps:
      # The three-dot diff needs the merge base, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The screen's own invariants
        run: ./scripts/release/swift-gate-applies.sh selftest
      - name: Does the gate apply to this commit?
        id: applies
        run: ./scripts/release/swift-gate-applies.sh decide

  check:
    name: cargo check -p arbos-mac (macOS)
    needs: decide
    if: needs.decide.outputs.applies == 'true'
    runs-on: macos-15
    # Measured on this workflow's own pull request over three runs, every one of them cold: the
    # job took 14 min 15 s, 13 min 34 s and 14 min 8 s, of which `cargo check` was 12 min 59 s,
    # 12 min 13 s and 13 min 53 s. Inside the first, 11 min 53 s was the external dependency build
    # and 66 s was the five workspace crates, so a run that restores the cache compiles for about
    # a minute. The queue in front of the job was 84.5, 162.7 and 4.5 minutes — the pool, not the
    # work, is what decides when this answers.
    #
    # The cap is set well above the cold figure because a timeout is no verdict rather than a red
    # one, which is the state this whole file exists to stop producing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain || rustup toolchain install
      # THE CACHE IS WORTH 11 OF THIS JOB'S 13 MINUTES, AND IN THIS REPOSITORY IT HAS TO BE EARNED.
      #
      # Actions cache here stands at 11.08 GB against a 10 GB budget, with 5.51 GB written in three
      # hours on 2026-11-05, so GitHub is evicting least-recently-used continuously. Measured on
      # this pull request: the entry saved at 21:00:54Z was gone before the next run of the same
      # job on the same branch looked for it at 23:45:18Z — "No cache found", and the second run
      # was cold too. An entry survives by being READ often, which is why main's 2.29 GB Linux
      # rust cache lives for days and a branch's Darwin entry does not last an evening.
      #
      # Two settings follow from that, and neither is cosmetic.
      #
      # `save-if` on main only. A cache saved on main is readable from every branch, so ONE entry
      # serves every pull request and is read by all of them — the access pattern that survives
      # eviction. The Swift gate instead saves a ~1.14 GB Darwin entry per BRANCH; four were live
      # at once on 2026-11-05, each read by one branch, and that is a large part of what keeps
      # this repository over its budget.
      #
      # The key is the dependency set, not the lockfile. This is ci.yml's own trick and its
      # reasoning is written out there: rust-cache's default key moves whenever any workspace
      # manifest does, and every release rewrites a dozen `version =` lines, so the default would
      # mint a fresh ~1 GB Darwin entry per release commit and evict something real each time.
      # `source`/`checksum` are the lines Cargo.lock gives EXTERNAL packages, which is exactly what
      # `cache-workspace-crates: false` (the default, kept) stores. A key that is too loose costs
      # rebuild time and never a verdict: cargo's own fingerprints decide what is reused, and
      # `--locked` refuses outright when the resolved graph disagrees with Cargo.lock.
      - name: Cache key for the dependency build
        id: cache-key
        run: |
          set -euo pipefail
          rustc -vV
          # The key is only as good as this grep, so say so here rather than hashing an empty
          # string for ever.
          lines=$(grep -cE '^(source|checksum) = ' Cargo.lock)
          if [ "$lines" -lt 100 ]; then
            echo "::error title=Cache key::Cargo.lock yielded $lines source/checksum lines, too few to be the dependency set. The cache key no longer tracks what it caches."
            exit 1
          fi
          echo "$lines external dependency lines in Cargo.lock"
          deps=$(grep -E '^(source|checksum) = ' Cargo.lock | shasum -a 256 | cut -c1-16)
          # `rust-toolchain.toml` says `channel = "stable"`, so the file alone pins no compiler;
          # `rustc -vV` carries the release and its commit hash. RUSTFLAGS is unset here today and
          # is folded in anyway, so an entry saved under one set of flags never answers for another.
          rust=$( { rustc -vV; cat rust-toolchain.toml; echo "RUSTFLAGS=${RUSTFLAGS:-}"; } | shasum -a 256 | cut -c1-16)
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: mac-check-${{ steps.cache-key.outputs.rust }}-${{ steps.cache-key.outputs.deps }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets, because the gap includes test code: #2089 (54bc19da) passed every check and
      # then broke every Mac release from 06:58 to 08:1x on 2026-10-28 in `cargo test -p arbos-mac
      # enter_tests`, which is Mac-only test code no Linux job compiles.
      #
      # No `-D warnings`. ci.yml sets it workspace-wide on Linux, but nothing has ever linted the
      # Mac-only half of this crate, so adopting the flag here would make this gate's first job to
      # fail on pre-existing warnings rather than on the compile errors it is here to catch.
      # Tighten it once the Mac path is known to be warning-clean.
      - run: cargo check -p arbos-mac --all-targets --locked
