name: image

# Builds the production `arbos-agent` image (sandbox-image.md §6), pushes it to GHCR, and registers it
# as the Daytona snapshot `arbos-agent-<version>`. Runs on an image tag or by hand.
#
# Secrets: DAYTONA_API_KEY (register the snapshot), GHCR_READ_TOKEN (a PAT with read:packages that
# Daytona uses to pull from GHCR; registered once as a Daytona registry by image/register-snapshot.sh).

on:
  push:
    tags: ["image-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (semver, e.g. 0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/arbos-agent

jobs:
  build-push-register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#image-v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build a static arbos-agentd
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --release -p arbos-agentd --target x86_64-unknown-linux-musl
          mkdir -p dist && cp target/x86_64-unknown-linux-musl/release/arbos-agentd dist/arbos-agentd

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            AGENTD_SHA=${{ github.sha }}
            IMAGE_VERSION=${{ steps.v.outputs.version }}
          # Own cache scope: release.yml builds the same Dockerfile on main with the default scope, and a
          # tag run reads the default branch's cache — stale arbos-pi-ext seed layers were served from it
          # on images 0.1.121–0.1.123 (2026-10-25, #1700/#1702).
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Local smoke (sandbox-image.md §6 step 4)
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:${{ steps.v.outputs.version }} -c '
            set -e
            pi --version | grep -q 1.2.0
            prime-agent --version | grep -q 0.10.0
            claude --version | grep -q 2.1.292
            agent-browser --version
            /opt/chrome/chrome --version
            uv --version && doppler --version && gh --version | head -1
            python3 --version && pip --version
            [ "$(git config --system --get user.email)" = agent@arbos.life ]
            d=$(mktemp -d) && git -C "$d" init -q && touch "$d/a" && git -C "$d" add a && git -C "$d" commit -qm smoke
            test -x /opt/prime-venv/bin/python
            test -f /etc/arbos/pi-seed/extensions/arbos-pi-ext/index.ts
            arbos-agentd --version
            [ "$(id -u)" = 1000 ]
            # Self-reference checkout: present, at this commit, readable, not writable by a non-root user.
            [ "$(git -C /opt/arbos/src rev-parse HEAD)" = "${{ github.sha }}" ]
            test -f /opt/arbos/src/docs/self-host.md && test -f /opt/arbos/src/crates/arbos-agentd/prompts/core.md
            ! touch /opt/arbos/src/.write-probe 2>/dev/null
            [ "$(stat -c %U:%a /opt/arbos/src)" = root:555 ]
            ! find /opt/arbos/src -name '.env' -o -name '*.p8' -o -name '*.p12' -o -name '*.pem' | grep -q .
            ! env | grep -E "KEY|TOKEN"
          '

      - name: Register the Daytona snapshot
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: image/register-snapshot.sh "arbos-agent-${{ steps.v.outputs.version }}" "${{ env.IMAGE }}:${{ steps.v.outputs.version }}"
