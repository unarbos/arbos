name: dev channel

# Every green commit on `main` becomes an installable, signed release, with no
# human picking a version number and no human pressing anything.
#
# Two channels exist, and they differ only in which document the app fetches:
#
#   stable  the tagged releases      (release.yml writes arbos-stable.json)
#   dev     every green main commit  (this workflow writes arbos-dev.json)
#
# ── the version ──────────────────────────────────────────────────────────────
# `0.2.0` out of desktop/Cargo.toml, and behind it the count of commits on the
# branch. The pair is what the bundle already carries — CFBundleShortVersionString
# and CFBundleVersion — so nothing is invented for the feed, and `0.2.0+1877`
# sorts above `0.2.0+1876` without anybody deciding anything. The short SHA
# rides along in the release entry so a build can be traced to its commit.
#
# ── never a red build ────────────────────────────────────────────────────────
# The trigger is `workflow_run` on `ci`, and the job runs only when that run
# concluded `success`. There is no path from a red commit to a published
# payload.
#
# ── safe to re-run ───────────────────────────────────────────────────────────
# Re-running *the same commit* publishes the same version and build again: the
# feed entry for that pair is replaced rather than added, the assets are
# uploaded with --clobber, and the rolling release is created only if it is
# missing. Running it twice leaves exactly what running it once leaves.
#
# A *different* commit is a different build, and does not replace the one
# before it — see KEEP_BUILDS below. The two are easy to read as one promise
# and they are not the same promise, which is why this says so twice.
#
# ── not fighting the steward ─────────────────────────────────────────────────
# The release steward merges to `main` on an hourly pass, so several commits
# can land at once and each starts a run. Two things keep that from becoming a
# queue of stale builds, and they are not the same thing:
#
#   * the concurrency group serialises the runs and drops all but the newest
#     *waiting* one. It never cancels a run that is under way — a cancel could
#     land between notarization and the feed write.
#   * the `plan` job then skips a run whose commit `main` has already moved
#     past, which is what stops the *first* of a batch building and notarizing
#     a build that is superseded before it finishes.
#
# The first alone leaves one wasted build per batch, which is what this looked
# like in practice.
#
# Tagged releases are release.yml's, under different tags and a different feed
# file, so the two never write the same asset.
#
# ── signing ──────────────────────────────────────────────────────────────────
# What makes a payload safe to install is the Ed25519 signature the feed
# carries over its bytes, checked by the app against the public key compiled
# into it (crates/arbos-update). That promise is ours to make and needs nothing
# from Apple, which is why this works today.
#
# Apple's signature is a second, separate promise, about what Gatekeeper does
# to a copy somebody downloads in a browser. `.github/actions/macos-payload`
# makes whichever of it is possible:
#
#   DEVELOPER_ID_CERT_P12 + P12_PASSWORD      signed, notarized, stapled
#   APPLE_SIGNING_CERT_P12 + ..._PASSWORD     signed (notarytool takes only a
#                                             Developer ID certificate)
#   neither                                   ad-hoc signed — what a fork gets,
#                                             and the updater installs it
#
# Notarization, once it is possible, is not allowed to fail quietly: the macOS
# job fails and nothing is published, rather than a payload going out that
# Gatekeeper would reject.
#
# ── one repository secret is required ────────────────────────────────────────
#   ARBOS_UPDATE_SIGNING_KEY   the private half of the update key, base64.
# Set it, and the four optional Apple secrets, with:
#   .github/setup-publishing.sh
# Until it exists this workflow skips itself with a note rather than publishing
# something every app would refuse.
#
# Everything hangs off one rolling pre-release tagged `dev`. The tag is a
# container, not a version: it is made once and never moved, and what changes
# is the assets on it. That is what keeps the feed URL constant —
# https://github.com/unarbos/arbos/releases/download/dev/arbos-dev.json —
# so a shipped app never has to be told where to look next.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Because a CI completion is not a reliable wake-up, and the plan only
  # decides when something wakes it.
  #
  # A commit gets two CI runs. On 2026-09-19 twice in one hour the failing
  # one finished first, fired this workflow, and was correctly told there
  # was nothing green to publish -- and then the *green* sibling completed
  # and fired nothing at all. #767's green sat unpublished for 38 minutes
  # and only went out when the next merge's CI happened to fire; #770's sat
  # until this was added. Neither was a wrong decision. Both were a right
  # decision that nobody asked for a second time.
  #
  # So: ask again on a timer. The plan job is a walk and a few API calls;
  # when there is nothing to publish it says so and stops, which is what it
  # will do on almost every one of these. That is the cost, and it buys a
  # channel whose worst case is ten minutes rather than "until someone
  # merges something".
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # To ask what CI concluded on a commit other than this run's own. The
  # plan job needs that to tell "a newer build will publish this" from
  # "a newer build went red and nobody will".
  actions: read

concurrency:
  group: dev-channel
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: dev
  # How many builds the dev channel keeps — in the feed, and as payloads on
  # the tag. One number, read by both the step that writes the feed and the
  # step that prunes the tag, so they cannot disagree about it.
  #
  # Three rather than one. The updater only ever wants the newest app, so
  # the older two are not there for it — they are there for the morning a
  # bad build goes out and somebody needs the one before it. A rollback is
  # downloading that zip and unpacking it over the app, and that is only
  # possible if the zip still exists.
  #
  # Three rather than ten, which is what this was. Ten is about 570 MB of
  # payloads for two builds' worth of actual use, on a channel that publishes
  # on every merge.
  KEEP_BUILDS: "3"
  # How many builds keep their *kernel* payload, which is a different
  # question and has a different answer.
  #
  # An app places a kernel on a remote machine by fetching the kernel for
  # its **own** build — anything else is replaced again at the next attach,
  # because the version check that opens a tunnel would still disagree. So
  # the app asking can be any age, and the kernel it needs has to still be
  # here.
  #
  # Three was an hour's window on a channel that publishes every twenty
  # minutes. Jacob's app was forty-seven builds behind when it could not
  # place a kernel on ArbosLife, so three would not have reached it. Sixty
  # is about two days.
  #
  # It is affordable because kernels are the cheap half: about 9 MB against
  # 35 MB for an app. Sixty kernels is roughly 1 GB, where sixty whole
  # builds would be nearly 5 GB. Releases past KEEP_BUILDS keep their
  # kernel payloads and nothing else, so they can never be offered as an
  # app update.
  KEEP_KERNELS: "60"
  # The iPhone app is not a payload — TestFlight installs it, and this only
  # says where. One URL per app rather than per build, so every release in the
  # feed carries the same link and the newest build behind it is whatever the
  # iOS loop last uploaded. App Store id 6812503407.
  IOS_TESTFLIGHT_URL: "https://beta.itunes.apple.com/v1/app/6812503407"

jobs:
  # What is being published, worked out once so the three jobs below name the
  # same files. The build number is a commit count, and a shallow checkout
  # would count differently in each job.
  plan:
    name: what to publish
    runs-on: ubuntu-latest
    # A failed CI run starts this too, and that is the point. It is the
    # only moment at which we learn that the commit an earlier green build
    # stepped aside for is never going to publish, so it is the moment to
    # go back for that green build. The job publishes nothing on its own
    # account — it re-asks "what is the newest commit worth publishing".
    #
    # The timer starts it for the same reason, and answers the case a CI
    # completion cannot: a green whose own event never arrived. See the
    # `schedule` note at the top. On a timer run there is no triggering
    # commit, so `EVENT_SHA` is empty and every candidate is asked of the
    # API — which is right, because nothing here is this run's own.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || github.event.workflow_run.conclusion == 'success'
      || github.event.workflow_run.conclusion == 'failure'
    env:
      HAVE_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      # How far back to look for a green commit. A merge batch is a few
      # commits; this is room for a bad afternoon without ever becoming an
      # unbounded walk through history.
      SCAN: "40"
      # How long a green build may sit unpublished while a newer commit is
      # still under test, in seconds.
      #
      # Stepping aside for a commit about to supersede this one saves a
      # runner and an Apple notarisation. Stepping aside for one that is
      # nowhere near finishing just starves the channel: on the morning of
      # 2026-09-18 twelve merges an hour outran CI continuously, every run
      # correctly deferred, and the feed sat eighty minutes and forty-two
      # builds behind `main` with nothing wrong anywhere.
      #
      # So the deferral is bounded. Past this, the newest green commit goes
      # out, and if the pending one turns green later it publishes then and
      # supersedes — which costs a build, and is worth it against an update
      # button that does not move.
      #
      # The clock runs on the *green* build, not on the pending one, and
      # that distinction is the whole of it. A clock on the pending commit
      # is reset by every merge: while `main` moves faster than CI, the
      # newest commit under test is always a young one, always worth
      # waiting for, and the deferral chain never ends — which is exactly
      # what happened for the eighty minutes above, and went on happening
      # after the first attempt at this cap. A clock on the green build
      # asks a question no new merge can reset: has something publishable
      # been waiting here longer than this? Once the answer is yes the
      # channel moves, whatever is still running ahead of it.
      PATIENCE: "600"
      # How long a run stays and asks again, rather than ending on the
      # promise that something else will ask, in seconds. And how long it
      # waits between asking.
      #
      # Every ending in the plan below used to be "somebody will come back
      # here". On 2026-09-19 nobody did, three times. A commit gets two CI
      # runs; the failing one finished first, fired this workflow, and was
      # correctly told there was nothing green yet — and the green sibling
      # then completed and fired nothing at all. #767's green sat 38
      # minutes, #770's until a fix was written for it, #776's until this
      # was. The ten-minute timer added for exactly this (#771) has not
      # fired once in the two hours since it landed, and this repository
      # has never had a scheduled run of any workflow, so the channel
      # cannot be left leaning on it.
      #
      # A run that stays needs nothing from GitHub's scheduler and nothing
      # from the next merge. It costs one idle `ubuntu-latest` job for as
      # long as it waits, and only when something is actually running that
      # might go green — a red `main` with nothing in flight ends at once,
      # because no amount of waiting changes it.
      #
      # Ten minutes, matching PATIENCE: past that the green-clock cap
      # publishes anyway, so there is nothing further for staying to win.
      WATCH: "600"
      BEAT: "60"
      # What started this run, taken from the event rather than asked of
      # the API again. See `ci_state`: re-asking about the triggering
      # commit is how a run ends up waiting on itself.
      EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      short: ${{ steps.plan.outputs.short }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      notes: ${{ steps.plan.outputs.notes }}
      minimum: ${{ steps.plan.outputs.minimum }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        run: |
          set -euo pipefail
          if [ "$HAVE_KEY" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dev channel not set up::ARBOS_UPDATE_SIGNING_KEY is not set, so nothing was published. Run .github/setup-publishing.sh once."
            exit 0
          fi
          # The question is not "was this run superseded" but "what is the
          # newest commit on `main` worth publishing right now".
          #
          # Those used to be the same question and they are not. A merge
          # batch starts a run per commit, and a run whose commit is no
          # longer the tip steps aside so the newer one publishes instead —
          # which saves a runner, an Apple notarisation and a few minutes of
          # the feed offering a build that is already behind. That part was
          # right and it stays.
          #
          # What was missing is the way back. On 2026-09-17, build 1609
          # (#490, the commit that draws voice lines in the chat) went
          # green, stepped aside for 1611 — and 1611's CI failed. Nothing
          # published. The green build had given up its turn to a commit
          # that never took it, and the channel sat still for half an hour
          # while Jacob waited for exactly that change. Stepping aside is
          # only safe if somebody is actually going to go.
          #
          # So: walk `main` back from the tip and take the newest commit
          # whose CI went green. If something newer than it is still
          # deciding, do nothing — that run will come back here and decide
          # properly. If everything newer has failed, the green one is the
          # newest publishable commit and this run publishes it, whichever
          # commit happened to trigger the run.
          #
          # And stepping aside is not for ever. The walk carries on past
          # the newest green to the greens behind it, all the way down to
          # the build the channel already has. Those are builds that could
          # have gone out and did not, and the oldest of them says how
          # long this channel has been standing still. Past PATIENCE it
          # stops standing still and publishes, with the pending run left
          # to supersede it later.
          #
          # Nothing has been built, signed, submitted or uploaded at this
          # point, so a run that decides to do nothing leaves nothing
          # half-done. That is why the decision is here and not in a
          # cancellation, which could land between notarization and the feed
          # write.
          #
          # A hand-started run publishes what it was pointed at. Somebody
          # asking for a build by name has a reason.
          git fetch --quiet origin main
          tip="$(git rev-parse FETCH_HEAD)"
          here="$(git rev-parse HEAD)"

          # What CI concluded for one commit, as the API has it: success,
          # pending, failed, or none at all. A commit nobody ran is not
          # pending — treating it so would wait for a run that is never
          # coming.
          api_state() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$1" -f per_page=20 --jq '
                if   ([.workflow_runs[] | select(.conclusion == "success")] | length) > 0 then
                  # With the moment it went green, so the caller can tell a
                  # build that has just landed from one that has been
                  # waiting for its turn.
                  "success " + ([.workflow_runs[]
                                 | select(.conclusion == "success")
                                 | (.updated_at // .run_started_at // .created_at)] | sort | last)
                elif ([.workflow_runs[] | select(.status != "completed")]  | length) > 0 then
                  # With the moment the oldest unfinished run started, so
                  # the caller can tell a run about to finish from one that
                  # has been going long enough to stop waiting for.
                  "pending " + ([.workflow_runs[]
                                 | select(.status != "completed")
                                 | (.run_started_at // .created_at)] | sort | first)
                elif (.workflow_runs | length) > 0 then "failed"
                else "none" end' 2>/dev/null || echo "none"
          }

          # How long ago a moment was, in seconds. Anything unreadable
          # counts as long ago: a timestamp we cannot parse is not a reason
          # to hold the channel.
          seconds_since() {
            local started now
            started="$(date -d "$1" +%s 2>/dev/null)" || return 0
            [ -n "$started" ] || { echo 999999; return 0; }
            now="$(date +%s)"
            echo $(( now - started ))
          }

          # The same question, except that the commit this run was started
          # by can never be answered "pending".
          #
          # A commit gets more than one CI run — two, about forty seconds
          # apart. The first to finish fires the event that starts this
          # workflow; asking the API a moment later sees its sibling still
          # going and says "pending", and the plan then waits for an event
          # that has already happened. On 2026-09-17 four runs in a row
          # each waited on their own triggering commit, and the channel sat
          # from 21:37 to 22:19.
          #
          # The event already carries that run's conclusion, so the answer
          # for this commit is never "wait": there is nothing left to wait
          # for. The API is still asked, because a green run is the only
          # thing that knows *when* the commit went green, and the clock
          # below is built on that. Its answer is taken only when it is
          # green; "pending" from a sibling is discarded, which is the
          # whole point.
          ci_state() {
            local state
            state="$(api_state "$1")"
            if [ -n "${EVENT_SHA:-}" ] && [ "$1" = "$EVENT_SHA" ]; then
              case "$state" in
                success*) echo "$state" ;;
                *)
                  if [ "${EVENT_CONCLUSION:-}" = "success" ]; then
                    # Green as of this event, which has only just fired.
                    echo "success $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  elif [ "${state#pending}" != "$state" ]; then
                    # Red as of this event, and a sibling of it is still
                    # going. Those are two different facts and the plan
                    # needs both: the verdict is "failed", because waiting
                    # for an event that has already fired is how a run
                    # waits on itself — and "sibling", because the green
                    # may still be coming and this run should be here to
                    # see it. Said in one word each, since a function read
                    # through `$( )` cannot set anything the caller keeps.
                    echo "failed sibling"
                  else
                    echo failed
                  fi
                  ;;
              esac
              return
            fi
            echo "$state"
          }

          # Where the channel stands. Read before the walk rather than
          # after it, because the walk needs it: a commit at or below this
          # build is already out, and nothing about it can be a reason to
          # publish anything now.
          feed_build="$(curl -fsSL --max-time 30 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/arbos-dev.json" 2>/dev/null \
            | jq -r '[.releases[].build] | max // 0' 2>/dev/null || echo 0)"
          feed_build="${feed_build:-0}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            choose="$here"
          else
            # A run that would end on "something else will come back here"
            # stays and asks again instead, because three times today the
            # something else never came. See WATCH.
            began="$(date +%s)"
            while :; do
            choose=""
            newer_pending=""
            waited=""
            pending_seen=""
            # `--first-parent`, or the walk leaves `main` entirely. A plain
            # rev-list descends into the branches that were merged in, and
            # those commits have green CI runs of their own from when the
            # PR was tested. One of them would be chosen, and it was never
            # a state `main` was in: its tree is the branch's, not the
            # merge's, and its commit count is not a build number on this
            # line at all. Following first parents keeps the walk to the
            # merges and direct commits that `main` actually passed
            # through, which is the only sequence the channel publishes.
            for candidate in $(git rev-list --first-parent --max-count="$SCAN" "$tip"); do
              # At or below what the channel already has there is nothing
              # left to learn. An older green is already published, so it
              # can be neither the build to publish nor a build kept
              # waiting, and asking about it would only spend requests.
              [ "$(git rev-list --count "$candidate")" -gt "$feed_build" ] || break
              state="$(ci_state "$candidate")"
              case "$state" in
                success*)
                  # The newest green is the one that publishes. The walk
                  # carries on past it to the greens behind it, because
                  # those are what the clock is read from: they are builds
                  # that could have gone out and did not.
                  : "${choose:=$candidate}"
                  ready="$(seconds_since "${state#success }")"
                  if [ "${ready:-999999}" -ge "$PATIENCE" ]; then
                    waited="$candidate"
                    break
                  fi
                  ;;
                # Newer than any green we go on to find, so it is still
                # entitled to publish instead of that one — but only for
                # as long as it looks like finishing soon. Past PATIENCE
                # it stops being a reason to hold the channel. A pending
                # commit *older* than the newest green holds nothing: that
                # green already supersedes it.
                pending*)
                  # Something here may yet go green, which is what makes
                  # staying worth the runner. Recorded whether or not it
                  # holds the channel.
                  pending_seen=yes
                  if [ -z "$choose" ]; then
                    age="$(seconds_since "${state#pending }")"
                    if [ "${age:-999999}" -lt "$PATIENCE" ]; then
                      newer_pending="${newer_pending:-$candidate}"
                    else
                      echo "::notice title=Not waiting::${candidate:0:7} has been running ${age}s, past the ${PATIENCE}s this waits. Publishing the newest green commit behind it."
                    fi
                  fi
                  ;;
                # "failed", or "failed sibling" when this run's own commit
                # has another CI run still going. The verdict is the same
                # either way; the second word only says that staying might
                # still be worth something.
                *)
                  case "$state" in
                    "failed sibling") pending_seen=yes ;;
                  esac
                  ;;
              esac
            done

            # Both of the endings below used to be "somebody else will ask
            # this again". Where something may still go green, this run
            # asks it again itself.
            watched="$(( $(date +%s) - began ))"
            if [ -n "$newer_pending" ] && [ -z "$waited" ]; then
              if [ "$watched" -lt "${WATCH:-600}" ]; then
                sleep "${BEAT:-60}"
                continue
              fi
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Waiting::${newer_pending:0:7} is newer and still running, and this run has watched it for ${watched}s. Its own run decides now."
              exit 0
            fi
            if [ -n "$newer_pending" ]; then
              echo "::notice title=Waited long enough::${newer_pending:0:7} is newer and still running, but ${waited:0:7} has been green for more than ${PATIENCE}s without going out. Publishing the newest green now; the pending one supersedes it when it lands."
            fi
            if [ -z "$choose" ]; then
              # Nothing green *yet* is not the same as nothing green. If
              # something is still running it may land while this run is
              # here to see it; if nothing is, no amount of waiting helps.
              if [ -n "$pending_seen" ] && [ "$watched" -lt "${WATCH:-600}" ]; then
                sleep "${BEAT:-60}"
                continue
              fi
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Nothing green::No commit on main newer than build $feed_build has a green CI run, within the last $SCAN, so there is nothing to publish."
              exit 0
            fi
            break
            done
          fi

          # Already out? Then this run has nothing to add. What makes the
          # whole thing safe to re-enter: any number of failure events can
          # fire without republishing what is already on the channel.
          want_build="$(git rev-list --count "$choose")"
          if [ "$want_build" -le "$feed_build" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::The channel is on build $feed_build, and ${choose:0:7} is build $want_build."
            exit 0
          fi

          if [ "$choose" != "$here" ]; then
            echo "::notice title=Reclaimed::${here:0:7} is not the one to publish; ${choose:0:7} (build $want_build) is the newest commit on main with a green CI, and nothing newer is still deciding."
          fi
          # Everything below reads the tree, so stand on the commit chosen.
          # The build jobs already check out `plan.outputs.sha`, so this is
          # the only place that has to move.
          git checkout --detach --quiet "$choose"
          sha="$choose"

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          # The oldest macOS the bundle claims, read from the plist so the feed
          # and the app cannot disagree about it.
          echo "minimum=$(sed -n '/LSMinimumSystemVersion/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' desktop/bundle/Info.plist)" >> "$GITHUB_OUTPUT"
          # The subject of the commit. For a merge that is the PR's own title,
          # which is the sentence worth showing next to an Update button.
          {
            echo "notes<<ARBOS_EOF"
            git log -1 --format=%s
            echo "ARBOS_EOF"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Arbos.app (macOS arm64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-14
    outputs:
      signing: ${{ steps.payload.outputs.signing }}
      notarized: ${{ steps.payload.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-channel-macos
          workspaces: |
            .
            desktop
      - id: payload
        uses: ./.github/actions/macos-payload
        with:
          build: ${{ needs.plan.outputs.build }}
          developer-id-p12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          developer-id-p12-password: ${{ secrets.P12_PASSWORD }}
          signing-p12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          signing-p12-password: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.payload.outputs.path }}" dist/
          cp "${{ steps.payload.outputs.kernel-path }}" dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: payload-macos
          # Only the zip. Nothing secret is ever in the workspace — the
          # certificate is decoded into $RUNNER_TEMP and deleted — but the glob
          # is narrow anyway.
          path: |
            dist/*.zip
            dist/arbos-kernel-*-macos-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  linux:
    name: arbos (Linux x86_64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-channel-linux
          workspaces: |
            .
            desktop
      - uses: ./.github/actions/linux-payload
        with:
          version: ${{ needs.plan.outputs.version }}
          build: ${{ needs.plan.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: [plan, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-channel-publish
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The rolling pre-release the channel hangs off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --target "${{ needs.plan.outputs.sha }}" \
              --title "Arbos dev channel" \
              --notes "placeholder"
          fi
      # The feed already published is the one to merge into: it carries the
      # builds before this one, which is what lets a machine that missed a few
      # still find the newest.
      - name: Last feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern arbos-dev.json --dir dist || echo "no feed yet; starting one"
      - name: Measure, sign, and write the feed
        env:
          ARBOS_UPDATE_SIGNING_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
          SHORT: ${{ needs.plan.outputs.short }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          ls -la dist
          mac="$(ls dist/Arbos-*-macos-arm64.zip)"
          mac_kernel="$(ls dist/arbos-kernel-*-macos-arm64.tar.gz)"
          # Two tarballs match `arbos-*`: the app and the kernel on its own.
          linux="$(ls dist/arbos-[0-9]*-linux-x86_64.tar.gz)"
          kernel="$(ls dist/arbos-kernel-*-linux-x86_64.tar.gz)"
          printf '%s\n' "$NOTES" > dist/notes.txt
          cargo run -q --release -p arbos-update --bin arbos-updatectl -- add \
            --feed dist/arbos-dev.json \
            --channel dev \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$SHORT" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            --notes-file dist/notes.txt \
            --notes-url "https://github.com/${{ github.repository }}/commit/${{ needs.plan.outputs.sha }}" \
            --minimum-system-version "${{ needs.plan.outputs.minimum }}" \
            --keep "$KEEP_BUILDS" \
            --keep-kernels "$KEEP_KERNELS" \
            --artifact "macos/arm64=$mac" \
            --artifact "macos/arm64/kernel=$mac_kernel" \
            --artifact "linux/x86_64=$linux" \
            --artifact "linux/x86_64/kernel=$kernel" \
            --link "ios:testflight=$IOS_TESTFLIGHT_URL"
          rm -f dist/notes.txt
          # What an app one build behind would be offered. A feed that answers
          # "up to date" here was written wrong, and saying so now beats an
          # Update button that never appears.
          cargo run -q --release -p arbos-update --bin arbos-updatectl -- show \
            --feed dist/arbos-dev.json \
            --current "$VERSION+$((BUILD - 1))" \
            --platform macos --arch arm64 | tee dist/check.txt
          grep -q "would be offered" dist/check.txt
          rm -f dist/check.txt
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
          SHORT: ${{ needs.plan.outputs.short }}
          NOTES: ${{ needs.plan.outputs.notes }}
          SIGNING: ${{ needs.macos.outputs.signing }}
        run: |
          set -euo pipefail
          # The payloads first, then the feed, and never the two in one
          # batch.
          #
          # `gh release upload` takes a batch concurrently and retries a
          # file whose connection dropped. A retry of a file the first
          # attempt had in fact created fails with "already exists", and
          # `set -e` takes the whole batch down with it — including the
          # uploads still in flight. On 2026-09-17 that left the feed
          # advertising a Linux app tarball that was never uploaded, and
          # the largest file is the one most likely to still be going when
          # it happens.
          #
          # A feed that is late is a channel that has not moved yet. A feed
          # that is early is a download that 404s. So the feed goes last,
          # and only once everything it names is really on the tag.
          for f in dist/*; do
            case "${f##*/}" in arbos-dev.json) continue ;; esac
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then break; fi
              if [ "$attempt" = 3 ]; then
                echo "::error title=Upload failed::${f##*/} would not upload after three tries"
                exit 1
              fi
              echo "retrying ${f##*/} ($attempt)"
              sleep $((attempt * 15))
            done
          done

          # What this build must have, before anything is allowed to drop.
          want="$(jq -r --argjson b "$BUILD" \
            '.releases[] | select(.build == $b) | .downloads[].url | split("/") | last' \
            dist/arbos-dev.json | sort -u)"

          # Drop from the feed anything the tag does not actually have.
          #
          # Older releases are kept for their payloads, and a payload that
          # went missing — a partial publish, a prune that ran when it
          # should not have — must stop being advertised rather than
          # standing as a 404 for ever. Self-healing, so one bad run cannot
          # block the channel behind it.
          have="$(gh release view "$TAG" --json assets -q '.assets[].name' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          jq --argjson have "$have" '
            .releases |= (
              map(.downloads |= map(select((.url | split("/") | last) as $n | $have | index($n))))
              | map(select((.downloads | length) > 0 or (.links | length) > 0))
            )' dist/arbos-dev.json > dist/arbos-dev.checked.json
          if ! cmp -s dist/arbos-dev.json dist/arbos-dev.checked.json; then
            echo "::warning title=Feed pruned::Entries naming payloads that are not on the tag were dropped."
            diff <(jq -S . dist/arbos-dev.json) <(jq -S . dist/arbos-dev.checked.json) || true
          fi
          mv dist/arbos-dev.checked.json dist/arbos-dev.json

          # This build's own payloads are not optional. Losing one of those
          # is this run failing, not something to quietly publish around.
          for name in $want; do
            if ! jq -e --arg n "$name" \
              '[.releases[].downloads[].url | split("/") | last] | index($n)' \
              dist/arbos-dev.json > /dev/null; then
              echo "::error title=Payload missing::$name did not reach the tag, so this build is not being published"
              exit 1
            fi
          done

          # Now the feed, which every download in it is known to be behind.
          gh release upload "$TAG" dist/arbos-dev.json --clobber
          # The page says what the newest build is, so the releases list reads
          # as a release and not as a bucket.
          commit_url="https://github.com/${{ github.repository }}/commit/${{ needs.plan.outputs.sha }}"
          feed_url="https://github.com/${{ github.repository }}/releases/download/$TAG/arbos-dev.json"
          {
            printf '**%s+%s** — [`%s`](%s)\n\n' "$VERSION" "$BUILD" "$SHORT" "$commit_url"
            printf '%s\n\n' "$NOTES"
            printf 'Every green commit on `main`, published for the app'"'"'s own updater. The tag is a container, not a version: what changes is the assets on it. Switch a machine to this channel in Settings › General › Updates; tagged releases are the stable channel.\n\n'
            printf 'macOS signature: `%s`.\n\n' "${SIGNING:-unknown}"
            printf 'Feed: <%s>\n' "$feed_url"
          } > dist/release-notes.md
          gh release edit "$TAG" --notes-file dist/release-notes.md
          rm -f dist/release-notes.md
          # Drop the payloads no release in the feed still points at, which
          # is what makes the tag agree with the feed — otherwise the
          # pre-release grows a payload per merge and never sheds one.
          #
          # The list comes from the feed rather than from a number here, so
          # it follows the two tiers by itself: a release past KEEP_BUILDS
          # has had its app payload dropped and keeps its kernel, so the app
          # zip is pruned from the tag and the kernel tarball stays.
          keep="$(jq -r '.releases[].downloads[].url | split("/") | last' dist/arbos-dev.json | sort -u)"
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              arbos-dev.json) continue ;;
            esac
            if ! printf '%s\n' "$keep" | grep -qxF "$name"; then
              echo "pruning $name"
              gh release delete-asset "$TAG" "$name" -y
            fi
          done
      - name: Say what went out
        env:
          SIGNING: ${{ needs.macos.outputs.signing }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          {
            echo "### dev channel"
            echo
            echo "Published \`${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build }}\` (\`${{ needs.plan.outputs.short }}\`)."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| macOS signature | \`${SIGNING:-unknown}\` |"
            echo "| Notarized | \`${NOTARIZED:-false}\` |"
            echo "| Feed | <https://github.com/${{ github.repository }}/releases/download/$TAG/arbos-dev.json> |"
            if [ "${NOTARIZED:-false}" != "true" ]; then
              echo
              echo "> The in-app updater installs this. A copy downloaded in a browser would be stopped by Gatekeeper until a Developer ID Application certificate is in \`DEVELOPER_ID_CERT_P12\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
