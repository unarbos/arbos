name: release

# Builds the Linux kernel binary and the signed, notarized macOS disk image,
# and attaches both to the GitHub release for the tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#   gh workflow run release -f tag=v0.2.0
#
# The macOS job needs five repository secrets, all from Jacob's Apple
# developer account (team 25SCF3Q2AK):
#   DEVELOPER_ID_CERT_P12  base64 of the "Developer ID Application" cert + key
#                          (Keychain Access › export .p12; `base64 -i cert.p12`)
#   P12_PASSWORD           the password given at export
#   APPLE_ID               the Apple ID email
#   APPLE_TEAM_ID          25SCF3Q2AK
#   APPLE_APP_PASSWORD     an app-specific password (appleid.apple.com › Sign-In
#                          and Security › App-Specific Passwords)
# Without them the job skips itself and the Mac worker's `make release`
# is the fallback.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to (e.g. v0.2.0)"
        required: true

# The tagged releases are also the *stable* update channel, which is what a
# machine follows unless it has been switched to dev in Settings. The three
# jobs at the bottom build the same payloads dev-channel.yml builds, sign them
# with the Arbos update key, and write `arbos-stable.json` onto the release —
# so an app on stable reads
#   https://github.com/unarbos/arbos/releases/latest/download/arbos-stable.json
# which GitHub resolves to the newest published release without the URL ever
# naming a version. See .github/workflows/dev-channel.yml for the whole scheme,
# and .github/setup-publishing.sh for the one command that sets the secrets.

permissions:
  contents: write

env:
  # The iPhone app is not a payload — TestFlight installs it, and this only
  # says where. One URL per app rather than per build, so every release in the
  # feed carries the same link and the newest build behind it is whatever the
  # iOS loop last uploaded. App Store id 6812503407.
  IOS_TESTFLIGHT_URL: "https://beta.itunes.apple.com/v1/app/6812503407"

jobs:
  linux-kernel:
    name: arbos-kernel (Linux x86_64)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-kernel
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
      - name: Build
        run: cargo build --release --locked -p arbos-kernel -p arbos-hub
      - name: Package
        run: |
          set -euo pipefail
          out="arbos-kernel-${TAG}-linux-x86_64"
          mkdir -p "dist/$out"
          cp target/release/arbos-kernel target/release/arbos-hub LICENSE "dist/$out/"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
          (cd dist && sha256sum "$out.tar.gz" > "$out.tar.gz.sha256")
      - name: Attach to the release
        # The release for the tag may already exist as a draft with
        # hand-written notes; upload into it. Otherwise create a draft.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes dist/*.tar.gz dist/*.sha256
          fi

  macos-dmg:
    name: Arbos.app (macOS arm64, signed + notarized)
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAVE_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The Makefile stamps CFBundleVersion with the commit count.
          fetch-depth: 0
      - name: Skip without signing secrets
        if: env.HAVE_CERT != 'true'
        run: echo "DEVELOPER_ID_CERT_P12 / APPLE_APP_PASSWORD not set; the Mac worker builds the DMG (cd desktop && make release)."
      - name: Toolchain from rust-toolchain.toml
        if: env.HAVE_CERT == 'true'
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        if: env.HAVE_CERT == 'true'
        with:
          key: release-macos
          workspaces: |
            .
            desktop
      - name: Import the Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity" || { echo "no Developer ID Application identity in the .p12"; exit 1; }
          echo "SIGN=$identity" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, notarize, staple
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # No Finder on a runner: the image keeps its backdrop and icon,
          # only the icon positions are left to Finder's defaults.
          DMG_LAYOUT: "0"
        run: |
          set -euo pipefail
          cd desktop
          make release SIGN="$SIGN"
      - name: Package
        if: env.HAVE_CERT == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktop/target/bundle.noindex/Arbos-*-arm64.dmg dist/
          cp target/release/arbos-kernel "dist/arbos-kernel-${TAG#v}-macos-arm64"
          (cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)
          ls -la dist
      - name: Attach to the release
        if: env.HAVE_CERT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes dist/*
          fi

  # ── the stable update channel ───────────────────────────────────────────────
  # What the tag is, in the two numbers the feed orders on. Worked out once so
  # the payload jobs and the feed job name the same files.
  plan:
    name: what to publish
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY != '' }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      short: ${{ steps.plan.outputs.short }}
      minimum: ${{ steps.plan.outputs.minimum }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - id: plan
        run: |
          set -euo pipefail
          if [ "$HAVE_KEY" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No update feed written::ARBOS_UPDATE_SIGNING_KEY is not set, so the release was built but the stable channel was not updated. Run .github/setup-publishing.sh once."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          # The version the app compares on is the one compiled into it, which
          # comes from desktop/Cargo.toml — not from the tag, which is only how
          # a person refers to it.
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "minimum=$(sed -n '/LSMinimumSystemVersion/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' desktop/bundle/Info.plist)" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  stable-macos:
    name: update payload (macOS arm64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-14
    outputs:
      signing: ${{ steps.payload.outputs.signing }}
      notarized: ${{ steps.payload.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
          workspaces: |
            .
            desktop
      - id: payload
        uses: ./.github/actions/macos-payload
        with:
          build: ${{ needs.plan.outputs.build }}
          developer-id-p12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          developer-id-p12-password: ${{ secrets.P12_PASSWORD }}
          signing-p12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          signing-p12-password: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}
      - run: |
          mkdir -p dist
          cp "${{ steps.payload.outputs.path }}" dist/
          cp "${{ steps.payload.outputs.kernel-path }}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: stable-payload-macos
          path: |
            dist/*.zip
            dist/arbos-kernel-*-macos-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  stable-linux:
    name: update payload (Linux x86_64)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-desktop
          workspaces: |
            .
            desktop
      - uses: ./.github/actions/linux-payload
        with:
          version: ${{ needs.plan.outputs.version }}
          build: ${{ needs.plan.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: stable-payload-linux
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  stable-feed:
    name: sign and write the stable feed
    needs: [plan, stable-macos, stable-linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install nightly --profile minimal && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-feed
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: stable-payload-*
          merge-multiple: true
      # The feed already on the newest published release carries the versions
      # before this one, which is what lets a machine that skipped a release
      # still find the newest.
      - name: Last feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern arbos-stable.json --dir dist \
            || echo "no stable feed yet; starting one"
      - name: Measure, sign, and write the feed
        env:
          ARBOS_UPDATE_SIGNING_KEY: ${{ secrets.ARBOS_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
          SHORT: ${{ needs.plan.outputs.short }}
        run: |
          set -euo pipefail
          ls -la dist
          mac="$(ls dist/Arbos-*-macos-arm64.zip)"
          mac_kernel="$(ls dist/arbos-kernel-*-macos-arm64.tar.gz)"
          # Two tarballs match `arbos-*`: the app and the kernel on its own.
          linux="$(ls dist/arbos-[0-9]*-linux-x86_64.tar.gz)"
          kernel="$(ls dist/arbos-kernel-*-linux-x86_64.tar.gz)"
          printf '%s\n' "$TAG" > dist/notes.txt
          cargo run -q --release -p arbos-update --bin arbos-updatectl -- add \
            --feed dist/arbos-stable.json \
            --channel stable \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$SHORT" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            --notes-file dist/notes.txt \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --minimum-system-version "${{ needs.plan.outputs.minimum }}" \
            # More than the dev channel keeps, and it costs nothing: a tagged
            # release's payloads live on its own release page, which is the
            # release, so nothing here ever prunes them. The only thing this
            # number decides is how far back the feed's list reaches.
            --keep 20 \
            --artifact "macos/arm64=$mac" \
            --artifact "macos/arm64/kernel=$mac_kernel" \
            --artifact "linux/x86_64=$linux" \
            --artifact "linux/x86_64/kernel=$kernel" \
            --link "ios:testflight=$IOS_TESTFLIGHT_URL"
          rm -f dist/notes.txt
          cargo run -q --release -p arbos-update --bin arbos-updatectl -- show \
            --feed dist/arbos-stable.json \
            --current "$VERSION+$((BUILD - 1))" \
            --platform macos --arch arm64 | tee dist/check.txt
          grep -q "would be offered" dist/check.txt
          rm -f dist/check.txt
      # Attached to *this* tag's release. `releases/latest/download/...`
      # resolves to whichever release is newest and published, so the shipped
      # app's feed URL never has to name a version — but a draft release is not
      # "latest", so the stable channel only moves when the steward publishes.
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Payloads first, each on its own, then the feed — the same
          # ordering the dev channel uses and for the same reason. A batch
          # upload retries a file whose connection dropped, a retry of one
          # the first attempt had created fails with "already exists", and
          # `set -e` takes the files still in flight down with it. When the
          # feed is in that batch it can go live naming a payload that
          # never arrived.
          #
          # A feed that is late is a channel that has not moved yet. A feed
          # that is early is a download that 404s.
          for f in dist/*; do
            case "${f##*/}" in arbos-stable.json) continue ;; esac
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then break; fi
              if [ "$attempt" = 3 ]; then
                echo "::error title=Upload failed::${f##*/} would not upload after three tries"
                exit 1
              fi
              echo "retrying ${f##*/} ($attempt)"
              sleep $((attempt * 15))
            done
          done
          if [ -f dist/arbos-stable.json ]; then
            gh release upload "$TAG" dist/arbos-stable.json --clobber
          fi
      - name: Say what went out
        env:
          SIGNING: ${{ needs.stable-macos.outputs.signing }}
          NOTARIZED: ${{ needs.stable-macos.outputs.notarized }}
        run: |
          {
            echo "### stable channel"
            echo
            echo "\`${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build }}\` attached to \`$TAG\`."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| macOS signature | \`${SIGNING:-unknown}\` |"
            echo "| Notarized | \`${NOTARIZED:-false}\` |"
            echo
            echo "The stable feed moves when this release is published, not while it is a draft."
          } >> "$GITHUB_STEP_SUMMARY"
