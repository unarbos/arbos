[project]
name = "arbos-voice"
version = "0.1.0"
description = "Arbos voice worker (Calls Phase 2, D75): joins LiveKit calls as the project agent, speaks with OpenAI gpt-realtime, judges relevance in group calls, runs tools through agentd via the relay"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents[openai,silero]~=1.8.8",
  "aiohttp>=3.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.4.1.post1,<2",
]

[project.scripts]
arbos-voice = "arbos_voice.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbos_voice"]
