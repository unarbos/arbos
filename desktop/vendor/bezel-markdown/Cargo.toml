[package]
name = "bezel-markdown"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A Notion-style block document model for gpui — markdown in, markdown out (patched: inline links do not auto-open)"

[lib]
name = "markdown"
path = "src/lib.rs"

[dependencies]
gpui = { version = "0.3.9", package = "bezel-gpui" }
motion = { version = "0.1.8", package = "bezel-motion" }
pulldown-cmark = { version = "0.13", default-features = false }
theme = { version = "0.1.8", package = "bezel-theme" }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(feature, values("cargo-clippy"))']
