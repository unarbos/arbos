# The call names another project (`mac/arbos`, a hub name): the gateway attaches to that kernel
# through the hub for this call, and the caller's words land there, not in the gateway's own kernel.
title = "Hub attach per call: session.start.project = machine/project"
hub = { machine = "mac", project = "arbos" }

[[steps]]
say = "Send an agent to tidy the release notes."
model = { ack = "On it." }
[steps.kernel]
reply = "I sent the agent tidy-release-notes to clean up the release notes."
[steps.kernel.spawn]
name = "tidy-release-notes"
done_after = 2.0
last_words = "Release notes tidied: 14 entries grouped by area, typos fixed."

[[steps]]
wait_spoken = "tidy release notes is done"

[[steps]]
wait_quiet = 1.0

[expect]
spoken_contains = ["I sent the agent tidy-release-notes", "tidy release notes is done"]
inbox = [{ channel = "voice", kind = "request", device = "desktop" }]
done_files = 1
