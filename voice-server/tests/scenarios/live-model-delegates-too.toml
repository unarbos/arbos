# The model does what its instructions say and delegates the work question itself, a beat after
# our transcript already sent it to the kernel. One kernel turn; the running state speaks
# "Yeah, one sec."; the model's own "One sec, let me check." stays unheard; the answer is
# the kernel's. The model's delegation joins ours and names that answer.
title = "GPT-Live: the model's own delegation joins ours — one kernel turn, working line, one answer"
engine = "openai"
path = "own"
asr_script = ["Send an agent to tidy the release notes."]

[[steps]]
say = "Send an agent to tidy the release notes."
live = { say = "One sec, let me check.", after = 0.6, delegate = true }
[steps.kernel]
reply = "I sent the agent tidy-release-notes to clean up the release notes."

[[steps]]
wait_spoken = "tidy-release-notes"

[[steps]]
wait_quiet = 1.5

[expect]
response_dones = 2  # the ready "Hi." plus the one answer
spoken_contains = ["one sec", "tidy-release-notes"]
spoken_not_contains = ["let me check"]
live_commentaries = 3  # "Hi." counted
user_frames = 1
