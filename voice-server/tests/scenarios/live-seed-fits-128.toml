# Jacob's Mac call, 2026-09-19 11:29Z: GPT-Live refused the session — "Invalid 'session.input':
# array too long ... maximum length 128, but got 135". A full screen (more rows than the history
# cap) made `extra[-0:]` pull every older kernel line in behind it. The seed must stay within the
# cap (40 lines + the developer preamble) and never exceed OpenAI's 128 whatever the inputs; the
